# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: mutate_gameplay_state_in_process
    status: active
    description: "Aucune mutation de velocity, position, rotation du Player, hitbox, state-machine, timers gameplay, ou health depuis _process(). Uniquement dans _physics_process()."
    why: "Race condition _process vs _physics_process casse le déterminisme GUT et introduit jitter visuel. Autorité unique = tick physique. Exception autorisée : camera yaw/pitch, VFX, HUD, tween UI (cosmétique sans impact sur l'état gameplay)."
    adr: docs/architecture/adr-0001-physics-rate-60hz.md
    added: 2026-04-21

  - pattern: is_action_just_pressed_direct_in_gameplay_physics_process
    status: active
    description: "Les consumers gameplay (Movement, Combat, Checkpoint) ne doivent PAS appeler Input.is_action_just_pressed directement dans _physics_process. Ils doivent polling InputManager.was_pressed_this_tick(action) qui consomme un flag setté dans InputManager._unhandled_input et reset en fin du _physics_process de l'InputManager."
    why: "À render > physics (ex : moniteur 144 Hz G-Sync + render 144 / physics 60), is_action_just_pressed retourne true uniquement pour un seul frame render. Si le tick physique ne tombe pas dans la bonne fenêtre render, l'input est silencieusement droppé. Le flag-via-signal garantit la survie de l'event jusqu'au prochain tick physique."
    adr: docs/architecture/adr-0001-physics-rate-60hz.md
    added: 2026-04-21

  - pattern: set_enabled_bool_global_without_refcount
    status: active
    description: "Aucun système ne doit exposer un set_enabled(bool) global partagé par plusieurs owners. Utiliser systématiquement un refcount pattern : request_disable(owner) / release_enable_request(owner) avec Dictionary<owner_id, true> et auto-cleanup sur owner.tree_exited. enabled dérivé : blockers.is_empty()."
    why: "Trois owners concurrents (Menu + Checkpoint + Cutscene) avec set_enabled(bool) produisent une race condition silencieuse : la fermeture de Menu réactive l'input alors que Checkpoint est encore en RESPAWN_DELAY. Observé comme bug structurel systems-designer F2 review r4 input-system. Refcount pattern élimine la classe entière."
    adr: docs/architecture/adr-0004-input-api-focus-handling.md
    added: 2026-04-21

  - pattern: input_singleton_access_from_non_main_thread
    status: active
    description: "Aucune lecture ou écriture de Input.* (y compris Input.mouse_mode, Input.is_action_pressed, Input.get_vector) depuis un Thread, WorkerThreadPool.add_task callback, ou Callable résultant d'un thread non-main. Godot Input singleton n'est pas documenté thread-safe. Uniquement main thread (_ready, _process, _physics_process, _input, _unhandled_input, _notification, signal handlers)."
    why: "Le singleton Input gère l'état polling au niveau OS ; race conditions sur mouse_mode ou event parsing depuis non-main = corruption silencieuse ou crash difficile à reproduire. Documenter explicitement préserve contre features Tier 3 (Accessibility hold-to-repeat) qui pourraient être tentées d'utiliser un Thread."
    adr: docs/architecture/adr-0004-input-api-focus-handling.md
    added: 2026-04-21

  - pattern: preprocessor_if_debug_build_in_gdscript
    status: active
    description: "Ne jamais écrire `#if debug_build`, `#ifdef DEBUG`, ou toute directive préprocesseur conditionnelle dans un .gd. GDScript n'a pas de préprocesseur. Pour conditionner un comportement au build debug, utiliser OS.has_feature(\"debug\") runtime + no-op release + assert() au besoin."
    why: "Écrire un `#if` dans GDScript = commentaire ou erreur parse selon la position. Toute logique test censée être 'compile-time stripped' devient soit toujours active (coût perf) soit jamais active (tests cassés) — pas de warning. Le runtime check idiomatique Godot est fonctionnellement équivalent (négligeable) et supporté."
    adr: docs/architecture/adr-0004-input-api-focus-handling.md
    added: 2026-04-21

  - pattern: alloc_in_hot_path_via_literal_dict_or_pushback
    status: active
    description: "Dans tout _unhandled_input, _input, _process, _physics_process exécuté > 30× par seconde, interdiction de : (1) `{ key = value, ... }` literal Dictionary, (2) `Array.push_back(...)` sans `.resize()` initial garantissant capacity, (3) concat `String` par `+` ou `%`, (4) allocation Node / Resource runtime. Utiliser PackedFloat32Array / PackedInt64Array / PackedByteArray pré-alloués + `write_idx % capacity` pour buffers circulaires. EXEMPTION DOCUMENTÉE (ADR-0006 D-8, 2026-04-23) : CombatSystem._collect_swing_hits() et CombatSystem._tick0_intersect_shape_overlap() sont exemptés pour ~16 alloc/swing (seen_ids + merged Dict/Array locaux bornés ≤ MAX_KILLS_PER_SWING=3, + 5 allocs PhysicsShapeQueryParameters3D.new au tick 0). 4 clauses justificatives : (1) taille bornée, (2) scope local court + GC déterministe, (3) AC-CMB-37 gate empirique (MEMORY_STATIC Δ ≤ 500 KB + OBJECT_COUNT Δ ≤ 5 / 1000 cycles), (4) anti-YAGNI refactor pool avant mesure. Clause de rollback : si AC-CMB-37 FAIL, refactor pool pré-alloué obligatoire (_PooledQueryParams + _seen_ids/_merged membres privés + .clear() en entrée _collect_swing_hits). EXEMPTION test fixtures : tests/unit/combat/mock_audio_bus.gd log Dict literal explicitement autorisé (pas hot path production)."
    why: "Pillar 1 (FLOW AVANT TOUT) requiert latence ≤ 16 ms p99. Allocations heap dans hot path génèrent pressure GC + jank non-déterministe. Un Dict literal 60-1000×/s est invisible à grep naïf (forme idiomatique GDScript) — seul un test zero-alloc MEMORY_STATIC delta le capture."
    adr: docs/architecture/adr-0004-input-api-focus-handling.md
    exemptions_documented_by:
      - docs/architecture/adr-0006-combat-tick-model.md  # D-8 Combat swing allocs + rollback AC-CMB-37
    added: 2026-04-21

  - pattern: use_taa_for_fast_motion_fps
    status: active
    description: "anti_aliasing/quality/use_taa = true est interdit au MVP. Utiliser SMAA 1x (Godot 4.5+, sharp + cheap) ou FXAA (cheap mais blurry) ou Off."
    why: "TAA introduit du ghosting sur fast motion (dash, wall-run, camera yaw rapide). Trainée visible = anti-Pillar-1 FLOW. Un joueur qui dash voit le trail de ses pixels = bug perceptuel. SMAA 1x nouveau 4.5 est le trade-off correct : plus net que FXAA, plus cheap que TAA, zero ghosting."
    adr: docs/architecture/adr-0003-rendering-latency.md
    added: 2026-04-21

  - pattern: manual_viewport_post_process_chains
    status: active
    description: "Aucun post-processing ne doit être implémenté via chaînes Viewport manuelles. Utiliser le nœud Compositor (Godot 4.3+) et des CompositorEffect resources."
    why: "Compositor = pattern idiomatique Godot 4.3+. Les manual viewport chains sont deprecated en pratique (pas de changement API mais pattern remplacé), fragiles avec le renderer Forward+, et ne s'intègrent pas aux optimisations 4.6 (glow before tonemap, AgX). CompositorEffect est la seule voie officielle."
    adr: docs/architecture/adr-0003-rendering-latency.md
    added: 2026-04-21

  - pattern: event_bus_autoload_for_movement_intra_gameplay_events
    status: active
    description: "Interdiction de créer ou d'utiliser un autoload MovementEvents (ou équivalent singleton) pour dispatcher les 8 signaux Movement entre MovementController et ses consumers (Camera, Combat, VFX, Audio, HUD). Les signals sont émis DIRECTEMENT depuis le MovementController (Player node) ; les consumers se connectent au Player node via référence scene tree ou injection."
    why: "EventBus autoload ajoute un double-dispatch (emit → MovementEvents → re-dispatch), un coupling caché via singleton global (consumers paraissent découplés mais dépendent d'un shared singleton), et une aggregation prématurée qui bloque le design si on introduit un 2e Player (coop). Le pattern direct typed signals sur le node qui porte le state est idiomatique Godot, cohérent avec ADR-0004 (InputManager → mouse_motion direct), et teste sans bootstrap d'autoload."
    adr: docs/architecture/adr-0005-movement-signals-architecture.md
    added: 2026-04-21

  - pattern: mutate_movement_state_from_signal_handler
    status: active
    description: "Dans un callback connecté à un signal Movement (dash_started, wall_run_entered, died, etc.), aucune mutation de l'état Movement n'est autorisée. Spécifiquement interdit dans un handler consumer : écriture sur player.velocity, player.position, player.rotation ; appel de player.die() ou player.respawn() (sauf Checkpoint System qui a responsabilité explicite via appel direct documenté, PAS via signal handler) ; mutation de movement_tuning.tres runtime. Autorisé : lecture des read-only properties (state, velocity, wall_normal, dash_cooldown_ratio)."
    why: "Write access à l'état Movement doit rester exclusif au MovementController lui-même (principe d'autorité unique sur son propre state). Un signal handler qui mute le state crée une boucle : le handler est appelé parce qu'une transition s'est produite, et il déclenche une autre transition — race avec la state machine en cours dans _physics_process. Debug extrêmement coûteux (état incohérent dans le même tick). die() idempotent limite les dégâts pour die() mais pas pour les autres mutations."
    adr: docs/architecture/adr-0005-movement-signals-architecture.md
    added: 2026-04-21

  - pattern: emit_movement_signal_from_process_not_physics_process
    status: active
    description: "Aucun emit d'un signal Movement (dash_started, dash_ended, wall_run_entered, wall_run_exited, wall_jumped, died, respawned, attacked, ou signal futur ajouté via amendement ADR-0005) ne doit se produire depuis _process(), _input(), _unhandled_input(), _ready(), ou un callback Timer.timeout. Uniquement depuis _physics_process() du MovementController ou une fonction appelée depuis celui-ci (die(), respawn(), state machine transitions internes)."
    why: "ADR-0001 pose _physics_process comme autorité unique pour les mutations d'état gameplay. Les signals Movement sont des notifications de transition d'état — ils DOIVENT être cohérents avec l'autorité. Emit depuis _process crée une race : le consumer reçoit le signal avant/après que _physics_process ait committed le state, selon le timing des deux callbacks. Reproductibilité GUT cassée, tests flaky, perception de jitter chez les consumers Camera/VFX."
    adr: docs/architecture/adr-0005-movement-signals-architecture.md
    added: 2026-04-21

  - pattern: camera_polls_movement_state_transitions
    status: active
    description: "Dans src/gameplay/camera/, interdiction stricte de polling de l'état Movement pour inférer les transitions. Patterns interdits : `if player.state == WALL_RUNNING:` / `if player.state == DASHING:` / `if player.is_dashing:` / `match player.state:` dans _process ou _physics_process de Camera System. Lecture read-only autorisée : `player.rotation.y` (yaw pour aim_forward), `player.global_position` (future orbit cam death). Le pattern canonique est : connecter handler `_on_wall_run_entered / _on_wall_run_exited / _on_dash_started / _on_dash_ended / _on_died / _on_respawned` dans `_ready()`, cacher l'état courant dans des flags privés (`_is_wall_running`, `_wall_side_cached`, `_is_dashing`), et lire ces flags dans le lerp `_process`. Whitelist explicite : les payloads typés des signaux (e.g. `wall_normal: Vector3` arg de `_on_wall_run_entered`) peuvent être lus et cachés."
    why: "Polling `player.state` couple Camera à l'enum interne State de MovementController — une refactorisation de l'enum (split DASH_AIR / DASH_GROUND, ajout PARRYING) casserait Camera silencieusement. Les 8 signaux typés ADR-0005 D-2 sont le contrat stable figé ; l'enum State est un détail d'implémentation. Par ailleurs, polling chaque frame dans _process re-évalue une condition qui ne change qu'à la transition — le pattern flag signal-driven est strictement plus efficace (1 load bool vs branch + getter + compare) et cohérent avec ADR-0005 D-4 (sync connection pour consumers light). Ce pattern sert de référence canonique pour tous les futurs consumers Movement (Combat, VFX, Audio, HUD)."
    adr: docs/architecture/adr-0002-camera-scene-tree-cameraarm.md
    added: 2026-04-23

  - pattern: combat_system_as_sibling_or_grandchild_of_player
    status: active
    description: "Interdiction de placer CombatSystem en sibling de Player (Level / Player + Level / CombatSystem) ou en petit-enfant via un wrapper intermédiaire (Player / Subsystems / CombatSystem). CombatSystem DOIT être direct child de Player (Player / CombatSystem) — pas de wrapper, pas d'autoload. Invariant runtime : assert(get_parent() == player_node) dans CombatSystem._ready() debug build. Lint grep sur scene .tscn : tout fichier qui instancie CombatSystem doit le placer directement sous le node Player."
    why: "L'ordre d'exécution _physics_process entre nodes dépend du DFS preorder Godot (parent → child 0 → descendants de child 0 → child 1 → ...). Rule 17 Hybrid mutual kill requires : Player._physics_process exécute AVANT CombatSystem._physics_process dans le même tick. Cela est garanti UNIQUEMENT si CombatSystem est direct child de Player. Sibling : ordre dépend arbitrairement du sibling index dans Level, casse silencieusement à tout déplacement éditeur. Petit-enfant : correct au MVP mais fragile (si Subsystems wrapper acquiert _physics_process, l'ordre peut être décalé). AC-CMB-49 Partie B (d) fail fast."
    adr: docs/architecture/adr-0006-combat-tick-model.md
    added: 2026-04-23

  - pattern: combat_physics_process_priority_nonzero
    status: active
    description: "Interdiction d'assigner CombatSystem.physics_process_priority à une valeur différente de 0 (défaut Godot). Ni négatif (force avant siblings), ni positif (après siblings). Assertion _ready() debug build : assert(physics_process_priority == 0, 'Combat priority doit rester défaut — préserve DFS order ADR-0006 D-2')."
    why: "physics_process_priority contrôle l'ordre d'exécution _physics_process au sein d'une fratrie. Valeur non-zero casse la garantie DFS parent-avant-enfant dont dépend Rule 17 Hybrid. Une valeur négative pourrait forcer Combat à s'exécuter avant Player dans le même sous-arbre → _death_pending set après le tick Combat → transition Dead décalée de 1 tick → mutual kill semantique cassée. AC-CMB-49 Partie B (e) couvre."
    adr: docs/architecture/adr-0006-combat-tick-model.md
    added: 2026-04-23

  - pattern: combat_prev_position_update_at_start_of_physics_process
    status: active
    description: "Dans CombatSystem._physics_process, interdiction de mettre à jour _prev_position au DÉBUT du callback (avant la logique de sweep). L'assignation _prev_position = _player.global_position DOIT être la DERNIÈRE ligne du _physics_process, après toute logique de sweep du tick courant. Initialisation dans _ready() : _prev_position = _player.global_position (tick 0 safe init)."
    why: "CombatSystem est direct child de Player (ADR-0006 D-1), donc Player._physics_process (Movement move_and_slide) exécute AVANT CombatSystem._physics_process via DFS preorder. Au moment où CombatSystem._physics_process démarre, player.global_position reflète DÉJÀ tick N (post-move). Si on assigne _prev_position en début de callback, on capture la position tick N (pas tick N-1) → sweep_delta = position_N - position_N = Vector3.ZERO → aucun kill possible (bug silencieux, absence de feedback observable). L'update en FIN capture tick N pour utilisation correcte au tick N+1. Formula 2 Combat (sweep inter-tick anti-tunneling) exige cette séquence précise."
    adr: docs/architecture/adr-0006-combat-tick-model.md
    added: 2026-04-23

  - pattern: combat_build_capsule_basis_via_looking_at_from_euler
    status: active
    description: "Interdiction de construire la Basis pour CapsuleShape3D sweep Combat via `Basis.looking_at(aim_forward, safe_up) * Basis.from_euler(Vector3(PI/2, 0, 0))` ou toute variante `Basis.looking_at * rotation permutation axe`. Utiliser exclusivement le helper privé CombatSystem._build_capsule_basis(forward: Vector3) -> Basis qui construit la Basis par cross product direct (axe Y = forward par construction, axe X = safe_up.cross(forward), axe Z = forward.cross(axe X)). Contract mathématique : (_build_capsule_basis(v) * Vector3.UP).angle_to(v) < 0.001 rad pour tout v non-colinéaire à safe_up."
    why: "Basis.looking_at oriente l'axe -Z local sur target (convention caméra Godot 4.x). La rotation `from_euler(Vector3(PI/2, 0, 0))` autour de X permute Y et Z de telle manière que l'axe +Y local pointe ANTIPARALLÈLE à aim_forward (inversion 180° silencieuse). La symétrie de CapsuleShape3D (forme symétrique sur son axe long) masquait l'erreur à la détection standard, mais ShapeCast3D.target_position = basis.inverse() * sweep_delta (Formula 2) propageait l'inversion dans la direction du sweep → tunneling garanti dès que aim_forward ≠ Vector3(0,0,-1). Convergence multi-specialist r5.2 (gameplay-programmer + godot-specialist fresh session). AC-CMB-08 r6 détecte via 100 échantillons sphère unitaire."
    adr: docs/architecture/adr-0006-combat-tick-model.md
    added: 2026-04-23

  - pattern: scene_tree_paused_set_outside_gsm
    status: active
    description: "Interdiction stricte de lire ou écrire `get_tree().paused = X` (true OU false) depuis tout fichier src/**/*.gd qui n'est PAS game_state_manager.gd. GameStateManager est l'autorité exclusive pour muter cet état global (ADR-0007 D-4). Lecture libre via `if get_tree().paused:` autorisée (read-only). Lint grep CI : `get_tree\\(\\).paused\\s*=` attendu exactement 2 matches, tous dans game_state_manager.gd (un pour `= true`, un pour `= false`). Tout match ailleurs = violation."
    why: "Plusieurs owners qui écrivent `get_tree().paused` = race conditions silencieuses (Menu set true pendant que Checkpoint set false en même tick → état final indéterminé). L'ADR-0007 centralise sur une machine à états finie avec transitions whitelistées → 1 seul point de drift possible = 0 bug. Pattern observé anti-pattern dans projets Godot sans orchestrateur."
    adr: docs/architecture/adr-0007-game-state-manager.md
    added: 2026-04-23

  - pattern: scene_change_via_change_scene_to_file_outside_gsm
    status: active
    description: "Interdiction d'appeler `get_tree().change_scene_to_file(path)` OU `get_tree().change_scene_to_packed(scene)` depuis tout fichier src/**/*.gd qui n'est PAS game_state_manager.gd. Toute transition de scène menu (main_menu.tscn, hub_scene.tscn, credits.tscn) passe par `GameStateManager.request_scene_transition(path)`. Pour étages gameplay, utiliser `LevelSystem.load_etage(id)` (scene additive via ResourceLoader.load_threaded_request, pas via change_scene_to_file). Lint grep CI : `change_scene_to_(file|packed)` uniquement dans game_state_manager.gd."
    why: "change_scene_to_file détruit entièrement la scène courante (Player perdu, CombatSystem perdu). Sans orchestration GSM, un Menu qui fait change_scene_to_file en pleine run kill le Player + credits + upgrades = perte de state. Encapsulation : le WHEN et WHY d'un scene change sont owned par GSM (state machine MENU ↔ PLAYING ↔ BOSS_DEFEATED) ; les autres systèmes REQUEST, ils ne décident pas."
    adr: docs/architecture/adr-0007-game-state-manager.md
    added: 2026-04-23

  - pattern: game_state_mutation_outside_transition_api
    status: active
    description: "Interdiction d'assigner `GameStateManager._current_state = X` depuis l'extérieur du module game_state_manager.gd. Toute mutation passe par les 5 méthodes publiques : request_pause / request_resume / request_scene_transition / start_etage / request_new_run. La méthode privée `_transition_to(new_state)` est l'unique chemin interne (appelée par request_* + handlers signals died/respawned/focus_lost/level_active). Lint grep CI : `GameStateManager\\._current_state\\s*=` attendu 0 match global."
    why: "La machine à états finie ADR-0007 D-2 garantit les invariants (transitions légales, émission state_changed unique, pause authority). Court-circuiter via write direct = transition silencieuse sans emit signal → consumers décorrélés de l'état réel. Violation d'encapsulation owner_system au même titre que mutate_movement_state_from_signal_handler (ADR-0005)."
    adr: docs/architecture/adr-0007-game-state-manager.md
    added: 2026-04-23

  - pattern: gsm_mutates_downstream_system_state
    status: active
    description: "Interdiction pour GameStateManager de muter directement l'état interne d'un système downstream. Spécifiquement interdit dans game_state_manager.gd : écriture sur player.velocity / player.position / player.rotation, appel de player.die() / player.respawn(), mutation de camera.fov / camera.rotation, appel de combat_system.trigger_swing(), mutation de level_system._current_etage_id. Autorisé : lecture read-only (get_current_state-like properties) + appels aux APIs publiques documentées (LevelSystem.load_etage/unload_current, InputManager.request_disable via refcount, etc.)."
    why: "GSM = orchestrateur d'état global, pas modificateur d'état interne. Chaque système owne son state (Movement → velocity/state, Camera → fov/rotation, Combat → swing state, Level → etage state). GSM les observe via signals + les oriente via APIs publiques. Violer cette règle = GSM devient un God Object qui connaît les internals de tout → couplage serré, impossibilité de tester GSM en isolation, et race conditions si GSM et owner_system mutent simultanément (ex: GSM set velocity.x=0 pour 'pause' pendant que Movement._physics_process calcule la prochaine velocity)."
    adr: docs/architecture/adr-0007-game-state-manager.md
    added: 2026-04-23

  - pattern: game_state_poll_in_hot_path
    status: active
    description: "Interdiction de polling `GameStateManager.get_current_state()` dans un hot path (_process, _physics_process, _unhandled_input appelés > 30×/s). Utiliser la connexion au signal `state_changed(new_state)` et cacher l'état dans un flag privé consumer-local. Lint grep avancé : référence à `GameStateManager.get_current_state()` OU `GameStateManager._current_state` depuis une fonction matching regex `_(process|physics_process|unhandled_input)` → flag REVIEW. Autorisé : appels depuis _ready() (lecture initiale pattern pull ADR-0007 D-9), depuis UI callbacks (button handlers), depuis request_*() handlers."
    why: "Polling chaque tick re-évalue un état qui ne change qu'à la transition (rare, ~1-10/run). Pattern connect signal + flag local est strictement plus efficace (1 load bool vs function call + enum compare) + cohérent avec architecture signals-driven déjà établie (ADR-0005 D-5 Movement + ADR-0006 D-6 Combat). Évite aussi le drift : consumer qui polls oubliera de se connecter au signal → bugs silencieux sur transitions tardives. Pattern canonique : `signal state_changed` → handler set `_is_paused: bool` → lecture flag dans _physics_process."
    adr: docs/architecture/adr-0007-game-state-manager.md
    added: 2026-04-23

  - pattern: combat_signal_sync_connection_outside_whitelist
    status: active
    description: "Dans les consumers des 4 signaux Combat (swing_started, swing_ended, enemy_killed, multi_kill), interdiction d'utiliser connexion SYNC (flag CONNECT_0 / default) hors de la whitelist ADR-0006 D-6. Whitelist MVP : (1) VFX flash blanc ColorRect sur enemy_killed — toggle visible + Tween sur ColorRect pré-existant, aucune alloc > 256 B, aucune instanciation Node ; (2) HUD multi-kill counter sur multi_kill — toggle bool + int set. TOUTE autre connexion SYNC = defect. Annotation obligatoire : chaque connect() sans CONNECT_DEFERRED dans src/gameplay/combat/ ou consumers doit être précédée d'un commentaire `# sync-exempt: ADR-0006 D-6` référençant la whitelist. Interdiction équivalente pour le consumer Combat du signal Movement died (autorité re-déclarée D-6) : player.died.connect(_on_player_died) DOIT être SYNC, tout CONNECT_DEFERRED casse Rule 17 Hybrid (AC-CMB-41 clause 8 grep structural)."
    why: "Le default DEFERRED pour consumers lourds (GPUParticles instantiate, AudioStreamPlayer.play) protège Pillar 1 contre burst CPU synchrones sur multi-kill. Une connexion SYNC pour un consumer lourd cause une cascade de latence frame-perceptible (Camera lag, jitter audio, janks). La whitelist SYNC est strictement limitée aux opérations triviales frame-precise (flash visuel, toggle UI) où DEFERRED ajouterait une frame de décalage perçu. Drift risk : un dev tenté d'ajouter SYNC Audio 'pour pas rater le feedback' casse Pillar 1. Lint grep + review stricts. Pour died handler spécifiquement, DEFERRED casse le mécanisme _death_pending (set au tick+1 → mutual kill impossible)."
    adr: docs/architecture/adr-0006-combat-tick-model.md
    added: 2026-04-23

  - pattern: level_system_direct_reference_to_peers
    status: active
    description: "LevelSystem (autoload singleton) ne doit référencer aucun de ses consumers (CheckpointSystem, EnemySystem, HazardSystem, SecretSystem, HUDSystem, TutorialSystem, AudioSystem, VFXFeedbackSystem) par class_name, NodePath, get_node(), ou static method call. Communication sortante exclusivement via les 7 signals typés du contrat level_lifecycle_events + les 6 lookups read-only du contrat level_spatial_lookups. Lint grep src/gameplay/level/*.gd sur les identifiants CheckpointSystem / EnemySystem / etc. = 0 match attendu. Code review strict : tout import / class_name / preload d'un consumer depuis LevelSystem = blocking defect."
    why: "Pattern outbound-only (ADR-0005 REQ-5 généralisé) garantit testabilité isolée de LevelSystem (GUT peut instancier sans bootstrap des peers) + découplage unidirectionnel (les peers évoluent sans casser Level). Référence directe introduit un cycle latent (Level → Enemy → Level.get_enemy_slots()) ou un coupling caché via autoload (Level → CheckpointSystem.notify() crée dépendance runtime fragile). Pattern canonique Godot + cohérence avec ADR-0004 InputManager + ADR-0005 MovementController outbound-only."
    adr: docs/architecture/adr-0011-level-scene-architecture.md
    added: 2026-04-23

  - pattern: mutate_level_state_from_peer_signal_handler
    status: active
    description: "Dans un callback connecté à un signal LevelSystem (level_active, level_unloading, etage_completed, level_load_failed, level_load_slow, room_entered, player_out_of_world), aucune mutation de l'état Level n'est autorisée. Spécifiquement interdit : écriture sur LevelSystem._state / _current_etage_root / _current_etage_id ; appel de LevelSystem.load_etage() / unload_current() depuis un handler consumer. AUTORISATIONS EXPLICITES : GameStateManager peut appeler load_etage() / unload_current() depuis son orchestration (ADR-0007 scene_transition_api) — ce n'est pas un signal handler, c'est du contrôle de flux. Autorisé : lecture read-only via get_state() / get_current_etage_id() / get_*_slots() depuis les handlers."
    why: "Write access à l'état LevelSystem reste exclusif au singleton lui-même + au GameStateManager orchestrateur (pattern autorité unique ADR-0005 REQ-6 généralisé à Level). Un handler qui mute _state crée boucle : handler appelé parce que transition, déclenche autre transition — race avec state machine en cours dans _process polling ou body_entered callback. Debug coûteux (état incohérent même tick). Ex: handler HUD qui force unload_current() depuis _on_room_entered — casse le flow gameplay et désabonne les peers incorrectement. Autorité GameStateManager préservée car ADR-0007 est lifecycle owner légitime."
    adr: docs/architecture/adr-0011-level-scene-architecture.md
    added: 2026-04-23

  - pattern: navigation_region3d_runtime_bake
    status: active
    description: "Interdiction d'appeler NavigationRegion3D.bake_navigation_mesh() à runtime (après boot global / hors éditeur). Les NavMesh des étages DOIVENT être bakées en éditeur authoring-time et persistées dans le fichier etage_NN.tscn. Contrat bilatéral : LevelSystem garantit la présence d'une NavigationRegion3D baked ; Enemy System (quand écrit) garantit aucun appel bake_navigation_mesh() runtime. Lint grep src/**/*.gd sur bake_navigation_mesh = 0 match attendu hors editor scripts tools/."
    why: "Bake runtime sur étage 5000 m³ coûte 200-800 ms (Tech-Risk-1 Godot addendum GDD level-system r2) — violation directe F4 budget load 1000 ms + Pillar 4 constance perf. Bake authoring-time = coût 0 runtime. Réciprocité enforcée dans design/gdd/enemy-system.md à sa création. Exception hypothétique Tier 2+ (ennemis destructibles modifient NavMesh) = ouverture ADR successeur + amendement pattern."
    adr: docs/architecture/adr-0011-level-scene-architecture.md
    added: 2026-04-23

  - pattern: collision_layer_mask_bitmask_literal_in_src_gd
    status: active
    description: "Interdiction d'affecter collision_layer ou collision_mask avec un littéral entier (décimal, binaire 0b, ou hex 0x) dans tout fichier .gd sous src/**. Patterns bannis (lint grep CI) : `\\bcollision_(layer|mask)\\s*=\\s*(0b[01]+|0x[0-9a-fA-F]+|[0-9]+)`. Exemples interdits : `body.collision_layer = 8` ; `area.collision_mask = 0b00010` ; `shape_cast.collision_mask = 0x04`. Pattern autorisé pour CollisionObject3D : `set_collision_layer_value(N, true)` / `set_collision_mask_value(N, true)` 1-indexée. Pattern autorisé pour PhysicsRayQueryParameters3D / PhysicsShapeQueryParameters3D (pas d'API per-bit native) : `query.collision_mask = CollisionLayers.build_mask([CollisionLayers.LAYER_ENEMY])` helper. Exception unique : fichiers .tscn / .tres (sérialisation éditeur Godot écrit la valeur décimale, non code) ET tests/**/*.gd assertions (AC-CMB-09/AC-LVL-12/13 comparent `== 0b00010` — read, pas write)."
    why: "Le bug off-by-one Level GDD r1 (commentaire `bit 4 = layer 4` faux — Project Settings 1-idx vs bit 0-idx, donc Layer 4 = bit 3 = 1<<3 = 8) a été corrigé r2 en forçant l'API 1-indexée. La lint CI empêche la régression. L'API per-bit est auto-explicative (`set_collision_layer_value(4, true)` ne peut pas être mal interprété), résistante au drift si les layers sont renumérotées (impossible par ADR-0008 D-1 mais defense-in-depth), et cohérente avec le helper PhysicsQueryParameters.build_mask() qui accepte les Array[int] 1-indexés. Sources uniques de vérité : project.godot [layer_names] (éditeur) + CollisionLayers class_name (code)."
    adr: docs/architecture/adr-0008-collision-layer-taxonomy.md
    added: 2026-04-23

  - pattern: tween_volume_db_in_audio_src
    status: active
    description: "Interdiction d'utiliser Tween pour interpoler `volume_db` d'un AudioStreamPlayer / AudioStreamPlayer3D dans tout fichier .gd sous src/core/audio_system.gd OR src/gameplay/audio/**. Pattern banni (lint grep CI) : `(Tween\\.tween_property|create_tween\\(.*\\.tween_property).*volume_db`. Exemples interdits : `tween.tween_property(swoosh, \"volume_db\", -80, 0.03)`. Pattern autorisé : interpolation manuelle dans `_physics_process` via `_get_time_msec.call() - _fade_start_msec` + `lerpf(start_db, end_db, t)`. Exception unique : Music crossfade entre rooms (Tween OK quand `Engine.time_scale == 1.0` garanti, e.g. transitions GSM hors gameplay)."
    why: "Tween est attaché à `_process` qui est scaled par `Engine.time_scale` Godot 4.6. Pendant slow-mo Combat (`time_scale = 0.3`), un fade Tween 30 ms wall-clock devient 100 ms perçus → swoosh-clac-blood overlap casse Fantasy staccato (Combat GDD r4 A-01 fix). AC-CMB-51 vérifie résolution `[25, 50] ms wall-clock` — Tween échoue ce gate. Pattern wall-clock dans `_physics_process` via Callable injection partagé Combat ↔ Audio (ADR-0006 D-5 + ADR-0009 D-3) garantit timing stable indépendamment de slow-mo + déterministe en CI via mock `_get_time_msec`."
    adr: docs/architecture/adr-0009-audio-system-architecture.md
    added: 2026-04-27

# Example:
#
# forbidden_patterns:
#   - pattern: autoload_singleton_coupling
#     status: active
#     description: "Systems must not directly reference Autoload singletons by name.
#       Use dependency injection or signals instead."
#     why: "Tight coupling to Autoloads makes systems untestable in isolation and
#       creates hidden dependencies that break when Autoload load order changes."
#     adr: docs/architecture/adr-0001-health-system.md
