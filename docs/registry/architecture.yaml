  - purpose: movement_intra_gameplay_event_pattern
    status: active
    api: 'Direct typed signals sur MovementController (Player node CharacterBody3D). 8 signals canoniques figés (D-2 ADR-0005). emit depuis _physics_process uniquement. Consumers connectent via player_ref.signal.connect(callable[, CONNECT_DEFERRED]).'
    not: 'EventBus autoload MovementEvents (rejected — double dispatch, aggregation prématurée multi-Player, coupling caché via singleton). Sub-node dédié MovementEventEmitter (rejected — indirection inutile, non-idiomatique Godot). MovementEventDispatcher class helper (rejected — réinvente le système signals Godot natif).'
