    adr: docs/architecture/adr-0004-input-api-focus-handling.md
    reason: "Refcount idempotent + auto-cleanup sur tree_exited élimine la classe bug ''input réactivé pendant autre owner encore disabled''. enabled = (_enable_blockers.is_empty())."
