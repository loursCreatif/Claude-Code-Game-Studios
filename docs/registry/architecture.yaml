      - camera-system
    adr: docs/architecture/adr-0004-input-api-focus-handling.md
    api_signature: "InputManager.was_pressed_this_tick(action: StringName) -> bool"
    semantics: "Appelé depuis _physics_process du consumer. Retourne true exactement une fois par edge press, sur le tick physique qui suit la press (pas le render frame). false si !enabled. Remplace is_action_just_pressed (forbidden par ADR-0001)."
    referenced_by:
      - docs/architecture/adr-0001-physics-rate-60hz.md
      - docs/architecture/adr-0004-input-api-focus-handling.md
    added: 2026-04-21
    revised: ""

