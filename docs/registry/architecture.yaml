    adr: docs/architecture/adr-0006-combat-tick-model.md
    api_signature: "player.died.connect(combat._on_player_died) # mode SYNC (flag default CONNECT_0, PAS CONNECT_DEFERRED)"
    semantics: "Exemption SYNC explicitement ré-déclarée sous autorité ADR-0006 D-6 (originalement documentée dans ADR-0005 D-5 amendment r2 scope historique). Handler CombatSystem._on_player_died : set _death_pending: bool = true, retour immédiat. Aucune mutation d'état Movement (respect ADR-0005 D-7 — seul un flag Combat-LOCAL est muté). Aucune allocation. Logique < 0.01 ms. Le flag _death_pending est consommé en FIN de CombatSystem._physics_process (après résolution complète des colliders du tick courant — Rule 17 Hybrid M1 r2), transitionnant à _state = State.DEAD. CONNECT_DEFERRED interdit : set au tick+1 romprait la séquence 'resolve colliders tick N puis transition Dead', cassant mutual kill semantique (AC-CMB-41 clause 8 grep structural garantit SYNC)."
    referenced_by:
      - docs/architecture/adr-0005-movement-signals-architecture.md
      - docs/architecture/adr-0006-combat-tick-model.md
      - design/gdd/player-combat-system.md
    added: 2026-04-23
    revised: ""

