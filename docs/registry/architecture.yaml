    not: 'CONNECT_DEFERRED partout (introduit cascade 1 frame de latence sur feedback critique — viole Pillar 1 FLOW). Synchrone partout (burst CPU sur mort/respawn quand VFX+Audio+HUD tous instantiate en même tick).'
