# ─── STATE OWNERSHIP ─────────────────────────────────────────────────────────
# Who is the authoritative owner of each piece of shared game state.
# Conflicts: two ADRs claiming to own the same state = data race / authority bug.
#
# Register state when it is READ or WRITTEN by more than one system.
# Internal-only state (never accessed by another system) does not need to be registered.
#
# Required fields: state, owner_system, adr, interface, referenced_by[], added
# interface: how other systems access this state (read-only property, method call,
#   signal, shared resource, etc.) — this is the contract other ADRs depend on.

state_ownership:
  - state: player_movement_state
    status: active
    owner_system: movement-system
    adr: docs/architecture/adr-0005-movement-signals-architecture.md
    interface: "MovementController.state: State (read-only enum { GROUNDED, AIRBORNE, DASHING, WALL_RUNNING, DEAD }). Pattern GDScript get: without setter (godot-specialist F7). Consumers read via player_ref.state ; transitions notifiées via signals typés directs (dash_started, wall_run_entered, etc. — cf. ADR-0005 D-2). Les consumers n'écrivent JAMAIS _state (private). write_access exclusif MovementController via state machine interne _physics_process."
    write_access: movement-system-only
    referenced_by:
      - docs/architecture/adr-0001-physics-rate-60hz.md
      - docs/architecture/adr-0002-camera-scene-tree-cameraarm.md
      - docs/architecture/adr-0005-movement-signals-architecture.md
      - docs/architecture/adr-0006-combat-tick-model.md
      - design/gdd/player-movement-system.md
      - design/gdd/camera-system.md
    added: 2026-04-21
    revised: ""

  - state: combat_prev_position
    status: active
    owner_system: combat-system
    adr: docs/architecture/adr-0006-combat-tick-model.md
    interface: "CombatSystem._prev_position: Vector3 — membre privé de CombatSystem (pas d'API publique). Initialisé à player.global_position dans CombatSystem._ready(). Mis à jour en FIN de CombatSystem._physics_process (après toute logique de sweep du tick courant — ADR-0006 D-3). Au début du tick N+1, contient la position tick N (post-move_and_slide Movement exécuté avant Combat via DFS preorder D-1). Utilisé par Rule 6 Combat + Formula 2 : target_position = basis.inverse() * (player.global_position - _prev_position) pour sweep ShapeCast3D inter-tick (anti-tunneling à V≤30 m/s). Aucun autre système ne lit ou écrit ce cache."
    write_access: combat-system-only
    referenced_by:
      - docs/architecture/adr-0006-combat-tick-model.md
      - design/gdd/player-combat-system.md
    added: 2026-04-23
    revised: ""

  - state: game_state
    status: active
    owner_system: game-state-manager
    adr: docs/architecture/adr-0007-game-state-manager.md
    interface: "GameStateManager.get_current_state() -> State (enum { MENU, PLAYING, PAUSED, RESPAWNING, BOSS_DEFEATED }) — read-only introspection synchrone thread-safe. Mutation exclusive via request_pause() / request_resume() / request_scene_transition(path) / start_etage(id) / request_new_run(). Transition privée _transition_to(new_state) centralise emit signal state_changed + mutation get_tree().paused. Transitions légales figées par D-2 graphe (13 transitions whitelistées) ; toute transition illégale → assert debug / push_error release. Boot state = MENU par défaut (pas d'emit au boot — consumers utilisent pattern pull via get_current_state() dans leur _ready())."
    write_access: game-state-manager-only
    referenced_by:
      - docs/architecture/adr-0007-game-state-manager.md
      - docs/architecture/adr-0004-input-api-focus-handling.md
      - design/gdd/level-system.md
      - design/gdd/input-system.md
      - design/gdd/player-combat-system.md
    added: 2026-04-23
    revised: ""

  - state: scene_tree_paused
    status: active
    owner_system: game-state-manager
    adr: docs/architecture/adr-0007-game-state-manager.md
    interface: "get_tree().paused: bool — autorité exclusive GameStateManager. Mutation uniquement depuis _transition_to() quand new_state == PAUSED (set true) ou transition PAUSED → PLAYING (set false). Aucun autre système ne doit écrire get_tree().paused directement (forbidden pattern scene_tree_paused_set_outside_gsm). Lecture libre depuis n'importe quel système (via is_paused boolean)."
    write_access: game-state-manager-only
    referenced_by:
      - docs/architecture/adr-0007-game-state-manager.md
    added: 2026-04-23
    revised: ""

  - state: level_scene_state
    status: active
    owner_system: level-system
    adr: docs/architecture/adr-0011-level-scene-architecture.md
    interface: "LevelSystem._state: LevelState (enum { UNLOADED, LOADING, ACTIVE, UNLOADING }) — introspection read-only via get_state() + get_current_etage_id() (retourne -1 si UNLOADED). Membre privé _current_etage_root: Node3D référence la racine etage_NN.tscn attachée à get_tree().root (pas self.add_child pour laisser Godot gérer queue_free sans tree-rewire). Transitions atomiques T-1..T-4 (ADR-0011 D-4) : UNLOADED → LOADING (load_etage), LOADING → ACTIVE (resources_ready + _validate_scene_hierarchy PASS), ACTIVE → UNLOADING (unload_current OR EtageExitTrigger.body_entered), UNLOADING → UNLOADED (1 frame post queue_free). Transitions illégales (load_etage en ACTIVE, etc.) = assert debug / push_error release. Consumers peers (Checkpoint/Enemy/Hazard/Secret/HUD/Tutorial/Audio/VFX) n'écrivent JAMAIS _state ou _current_etage_root — orchestration exclusive LevelSystem + GameStateManager via load_etage/unload_current."
    write_access: level-system-only
    referenced_by:
      - docs/architecture/adr-0007-game-state-manager.md
      - docs/architecture/adr-0011-level-scene-architecture.md
      - design/gdd/level-system.md
    added: 2026-04-23
    revised: ""

