# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: physics_tick_rate
    status: active
    api: 'physics/common/physics_ticks_per_second = 60'
    not: '120 Hz (rejected — coût CPU doublé, gain imperceptible ≤ 8 ms sous seuil perception click one-shot)'
    adr: docs/architecture/adr-0001-physics-rate-60hz.md
    reason: "Aligne 1 tick physique = 1 frame vsync 60. Satisfait Pillar 1 ≤ 16 ms intra-engine sans doubler le budget CPU physics."
    referenced_by:
      - docs/architecture/adr-0001-physics-rate-60hz.md
    added: 2026-04-21
    revised: ""

  - purpose: gameplay_state_authority
    status: active
    api: '_physics_process(delta) — unique callback autorisé à muter l''état gameplay (velocity, position, rotation, hitbox, state-machine, health, timing tick-based)'
    not: '_process() (cosmétique only — camera yaw/pitch, VFX, HUD, tween UI, debug overlay)'
    adr: docs/architecture/adr-0001-physics-rate-60hz.md
    reason: "Évite race conditions _process vs _physics_process. Autorité unique = tick physique = reproductibilité GUT."
    referenced_by:
      - docs/architecture/adr-0001-physics-rate-60hz.md
    added: 2026-04-21
    revised: ""

  - purpose: physics_engine_3d
    status: active
    api: 'physics/3d/physics_engine = "JoltPhysics3D"'
    not: 'GodotPhysics3D (rejected — déterminisme inconsistant, stabilité contact moindre)'
    adr: docs/architecture/adr-0001-physics-rate-60hz.md
    reason: "Défaut Godot 4.6. Déterminisme supérieur requis pour wall-run/katana hitbox replays. Caveat : HingeJoint3D.damp non supporté Jolt (auditer joints à leur design)."
    referenced_by:
      - docs/architecture/adr-0001-physics-rate-60hz.md
    added: 2026-04-21
    revised: ""

  - purpose: input_polling_api
    status: active
    api: 'InputManager.was_pressed_this_tick(action: StringName) -> bool (polling gameplay depuis _physics_process)'
    not: 'InputManager.is_action_just_pressed() — supprimé ; Input.is_action_just_pressed() direct depuis gameplay — forbidden par ADR-0001'
    adr: docs/architecture/adr-0004-input-api-focus-handling.md
    reason: "Flag-via-signal (set dans _unhandled_input, lu au tick suivant, reset par swap début _physics_process InputManager) garantit zéro drop d''input one-shot quand render fps > physics rate (cas 144 Hz G-Sync)."
    referenced_by:
