  - purpose: collision_layer_taxonomy_and_mask_api
    status: active
    api: 'Taxonomie 5 layers 1-indexées figée : Layer 1 LAYER_PLAYER (solid, CharacterBody3D Player + ShapeCast katana) ; Layer 2 LAYER_ENEMY (solid, Enemy CharacterBody3D body) ; Layer 3 LAYER_ENEMY_HITBOX (Area3D lethal hitboxes — laser, projectile, spike, AoE boss) ; Layer 4 LAYER_ENVIRONMENT (solid, StaticBody3D géométrie statique) ; Layer 5 LAYER_INTERACTIVE (Area3D triggers — RoomTrigger, Checkpoint, Secret, EtageExit, WorldBounds). API accès : set_collision_layer_value(N,bool) / get_collision_mask_value(N) 1-indexée obligatoire pour CollisionObject3D. Query params PhysicsRayQueryParameters3D / PhysicsShapeQueryParameters3D : helper CollisionLayers.build_mask(Array[int]) -> int centralise la construction. Noms canoniques dans project.godot [layer_names]/3d_physics/layer_1..5 source unique de vérité éditeur. Archetype mask contracts D-2 : Player body layer=1 mask=30 (Enemy+Hitbox+Env+Interactive) ; Katana ShapeCast layer=1 mask=2 ; Enemy body layer=2 mask=8 (Env only — réciprocité unilatérale) ; Enemy lethal hitbox layer=3 mask=1 ; Static env layer=4 mask=0 ; Interactive trigger layer=5 mask ⊃ 1 (Player obligatoire, sinon body_entered silencieux). Layers 6-32 réservées (6 Hazard projectile, 7 Pickup, 8 AI nav volume) — attribution par amendement ADR requis. Lint CI : grep \\bcollision_(layer|mask)\\s*=\\s*(0b|0x|[0-9]) sur src/**/*.gd = 0 match attendu.'
    not: 'Bitmask littéral direct (collision_layer = 0b01000 ou = 8) ; bit manipulation (|= 1 << 3) ; duplication des constantes dans un autoload GDScript (project.godot [layer_names] est source unique) ; allocation d''une layer 6+ sans amendement ADR ; utilisation du numéro de layer "4" dans un commentaire sans préfixe LAYER_ENVIRONMENT (ambigu).'
