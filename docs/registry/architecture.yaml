      - audio-system
      - hud-system
      - credit-economy-system
    adr: docs/architecture/adr-0006-combat-tick-model.md
    signal_signature: "swing_started(direction: Vector3) ; swing_ended() ; enemy_killed(enemy: Node, position: Vector3) ; multi_kill(count: int)"
    semantics: "4 signals typés directs émis par CombatSystem (Node3D = direct child de Player — ADR-0006 D-1) depuis _physics_process UNIQUEMENT (ADR-0001 authority). Consumers se connectent via player.CombatSystem.signal_name.connect(callable[, CONNECT_DEFERRED]). Connection mode par défaut suit ADR-0005 D-5 (DEFERRED pour lourds, SYNC pour light). EXEMPTION SYNC autorisée au MVP pour 1 seul cas : VFX flash blanc ColorRect sur enemy_killed (toggle visible + Tween sur ColorRect pré-existant — aucune alloc > 256 B, Pillar 1 frame-precise). Toute autre connexion SYNC hors whitelist = defect (lint grep + code review). `enemy_killed.position` = enemy.global_position capturé au tick du kill (value type, pas de référence au node qui peut être queue_freed avant dispatch DEFERRED). Zero-alloc payloads. Ordre intra-tick : swing_started → N× enemy_killed (même tick possible sur multi-hit) → multi_kill(N) si N≥2 → swing_ended (tick ACTIVE_TICKS+1). swing_ended NON émis si transition Swinging → Dead (Rule 17 Hybrid). CombatSystem = outbound-only : aucune référence directe aux consumers (ADR-0006 REQ-10, réplique ADR-0005 D-10)."
    referenced_by:
      - docs/architecture/adr-0006-combat-tick-model.md
      - design/gdd/player-combat-system.md
    added: 2026-04-23
    revised: ""

