      - hud-system
    adr: docs/architecture/adr-0005-movement-signals-architecture.md
    signal_signature: "dash_started(dash_dir: Vector3, dash_speed: float) ; dash_ended() ; wall_run_entered(wall_normal: Vector3) ; wall_run_exited() ; wall_jumped(wall_normal: Vector3, launch_velocity: Vector3) ; died() ; respawned(spawn_position: Vector3) ; attacked()"
    semantics: "8 signals typés directs émis par MovementController (CharacterBody3D Player node) depuis _physics_process UNIQUEMENT (ADR-0001 authority). Consumers se connectent via player_ref.signal_name.connect(callable[, CONNECT_DEFERRED]). Connection mode : CONNECT_DEFERRED pour consumers lourds (instanciation Node, AudioStream.play, alloc > 256 bytes, logique > 0.5 ms) sinon sync. Ordre intra-tick déterministe : sortie avant entrée (e.g. dash_ended avant died si die() pendant Dashing). died terminal (rien après dans le même tick). Idempotence par transition (signal entrée émis 1× par transition d'état). Zero-alloc payloads (Vector3/float value types, pas de Dictionary literal). Typed strictness check en debug build seulement — test contrat GUT obligatoire. MovementController = outbound-only : ZERO référence vers consumers (pas de class name, pas de $NodePath, pas de preload)."
    referenced_by:
      - docs/architecture/adr-0001-physics-rate-60hz.md
      - docs/architecture/adr-0005-movement-signals-architecture.md
      - docs/architecture/adr-0006-combat-tick-model.md
      - design/gdd/player-movement-system.md
