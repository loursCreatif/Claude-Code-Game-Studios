  - name: BASE_UPGRADE_COST
    status: active
    source: design/gdd/credit-economy-system.md
    referenced_by:
      - design/gdd/credit-economy-system.md
      - design/gdd/shop-system.md
    value: 20
    unit: credits
    safe_range: [10, 40]
    notes: "Coût de l'upgrade à n=0 (Credit F-CRD-3 cost curve linéaire `cost_n = BASE_UPGRADE_COST + n × TIER_COST_STEP`). Owned par Credit Economy ; consommé par Shop System F-SHP-1 (lookup délégué via `cost_at_index(n)`). Shop ne redéfinit JAMAIS cette constante — la lit depuis Credit ou via tuning knob `assets/data/shop_config.tres` synchronisé avec Credit. F-SHP-3 sanity Pillar 2 : `total_cost_MVP = 60 cr` (n=0 → 20 + n=1 → 40) avec `session_yield_max_MVP = 85 cr` → marge 25 cr cohérente Pillar 2 + anti-grinding. Variation < 10 = trivialité économique (joueur achète tout sans effort). Variation > 40 = wall MVP impossible (n=0 inaccessible étage 1)."
