    notes: "Incrément linéaire par rang dans Credit F-CRD-3 cost curve. cost_n = BASE_UPGRADE_COST + n × TIER_COST_STEP. Pour MVP : 20, 40 cr. Tier 2+ Full Vision (8 upgrades) : 20, 40, 60, 80, 100, 120, 140, 160 cr. Owned par Credit Economy ; consommé par Shop F-SHP-1. La courbe linéaire (vs exponentielle) borne croissance prédictiblement et empêche tout wall final exponentiel. F-SHP-4 ordering rationale : upgrade n=0 cheapest = double_jump (impact perceptuel immédiat Pillar 2), n=1 = dash_horizontal (tactique). Shop NE redéfinit JAMAIS cette valeur."
