      - design/gdd/level-system.md
      - docs/architecture/adr-0008-collision-layer-taxonomy.md
    value: 5
    unit: bit_position
    notes: "Layer 5 (bit 0b10000). Triggers shop, checkpoints, secrets. Player mask inclut. Level System est l'**autorité de placement** pour les Area3D (RoomTrigger, CheckpointVolume, SecretVolume, EtageExitTrigger, WorldBoundsVolume) — cf. Level GDD R-3 + AC-LVL-13 (monitorable=false, monitoring=true). Canonisée ADR-0008 2026-04-23. Archetype mask contract Interactive trigger Area3D : layer=5 mask ⊃ 1 (Player obligatoire sinon body_entered silencieux — gate AC-LVL-13 r2). Futur : Shop GDD, Checkpoint GDD, Secret GDD consommeront les slots publiés par Level au signal level_active."
