    notes: "Layer 4 (bit 0b01000). Sols, murs, plafonds. Player mask inclut. Enemy mask inclut (nav). Katana mask EXCLUT (ne coupe pas les murs). Level System est l'**autorité de placement** : tous les StaticBody3D sous `StaticEnvironment/` sont sur ce layer (cf. Level GDD R-3 + AC-LVL-12). Aucun autre système n'instancie de géométrie sur ce layer. Canonisée ADR-0008 2026-04-23. Archetype mask contract Static environment : layer=4 mask=0 (statique détecte rien, détecté par tous)."
    added: 2026-04-22
    revised: 2026-04-23

  - name: LAYER_INTERACTIVE
    status: active
    source: design/gdd/player-combat-system.md
    referenced_by:
