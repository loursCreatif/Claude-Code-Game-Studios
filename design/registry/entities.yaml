# Game World Entity Registry
#
# PURPOSE: Single source of truth for all named game-world facts that appear
# in more than one document. Skills check this before writing new content to
# detect cross-doc inconsistencies at authoring time.
#
# RULES:
#   - Only register facts that cross system boundaries. Internal-only facts
#     (a formula used in one GDD only) do NOT need to be registered.
#   - Never delete entries — set status: deprecated instead.
#   - When a value changes: update the value, set revised: to today's date,
#     and add a comment with the old value and which GDD changed it.
#   - source: is the authoritative GDD — the one that "owns" this fact.
#     Other GDDs that reference it list themselves in referenced_by.
#   - When a new GDD references an existing entry, append its path to
#     referenced_by. Do not create a duplicate entry.
#
# WRITTEN BY: /design-system (Phase 5 — after GDD sections are approved)
#             /consistency-check (when resolving conflicts)
# READ BY:    /design-system (Phase 2 — before authoring begins, and after
#               Section C/D writes to conflict-check new entities/formulas)
#             /consistency-check (primary input — grep-first, GDD-second)
#             /review-all-gdds (Phase 1 — baseline for Phase 2 checks)
#             /architecture-review (data structure and interface validation)
#
# SEARCH PATTERNS (for skills using Grep):
#   All entity names:        Grep pattern="^  - name:" path="design/registry/entities.yaml"
#   Specific entity:         Grep pattern="  - name: goblin" path="design/registry/entities.yaml"
#   All items:               Grep pattern="^  - name:" path="design/registry/entities.yaml" (items section)
#   What combat.md owns:     Grep pattern="source: design/gdd/combat.md"
#   What inventory.md uses:  Grep pattern="referenced_by.*inventory"
#   All gold values:          Grep pattern="value_gold:"
#   Deprecated entries:      Grep pattern="status: deprecated"
#
# FORMAT: YAML. Consistent indentation is critical for grep reliability.
#   Sections: entities | items | formulas | constants
#   Each entry: name, status, source, referenced_by[], attributes{}, added, revised

version: 1
last_updated: "2026-04-27"   # /consistency-check audio-system (r1 solo auto-approve) : 2 valeurs stale + 2 referenced_by stale absorbés. SLOW_MO_SCALE 0.15 → 0.3 (safe_range [0.10,0.30] → [0.10,0.50]) et SLOW_MO_DURATION_MS 100 → 50 (safe_range [50,200] → [30,150]) — alignement sur Combat GDD r1 retune Martin D3 (jamais répercuté au registry au moment de Combat r1 — Audio GDD r1 a détecté la divergence et l'a documentée OQ ligne 384). audio-system.md ajouté en referenced_by sur les deux constantes (consommé par mix hierarchy, ducking, AC-AUD-07, Formula 4). Cross-GDD gap signal Level `etage_loaded` documenté hors scope registry (recommandation : amendement Level GDD r4 ou alternative décidée par Martin D3 avant Sprint Audio). Previous: /design-system audio-system (r1 solo auto-approve, ADR-0009 Accepted 2026-04-27 binding) : Audio System ajouté en referenced_by sur 1 constante existante (RESPAWN_DELAY — death.wav ≤ 40 ms = RESPAWN_DELAY 50 ms - 1 frame margin, Pillar 3 contract). Aucune nouvelle constante cross-system registrée — toutes constantes Audio sont system-internal MVP (swoosh_fade_duration_ms, ducking_release_ms, ducking_db_attenuation, ambient_crossfade_ms, blood_ambiance_delay_ms, death_audio_max_duration_ms, pool_2d_size, pool_3d_size — toutes Tuning Knobs Audio GDD, pas consommées par autre système au MVP). Bus names `Master / Music / SFX / swing_active / combat_kill / Ambience / UI` figés ADR-0009 D-1 (autorité canonique = Audio GDD, pas registry — figés via const StringName helper static `AudioBuses`). Previous: /design-system game-state-manager (r1 solo auto-approve + réalignement sur ADR-0007 Proposed) : GSM ajouté en referenced_by sur RESPAWN_DELAY (Formula 2 respawn window). Aucune nouvelle constante cross-system registrée — draft initial proposait RESPAWN_SAFETY_TIMEOUT_MS (500 ms) mais retiré au réalignement ADR-0007 D-7 (GSM pur state tracker MVP, pas de safety timer). State enum values (MENU/PLAYING/PAUSED/RESPAWNING/BOSS_DEFEATED) NON registrés comme entries — déjà documentés architecture.md §6.4, architecture.yaml l.125, et ADR-0007 D-2 comme autorité. API publique figée ADR-0007 D-10 (5 verbes + 1 signal state_changed(new_state) + 1 getter get_current_state). Previous: /design-system level-system r1 : Level System cité en referenced_by sur 4 constantes existantes (KATANA_REACH via Formula 1 min_opening_width = 2 × KATANA_REACH = 3.6 m ; LAYER_ENVIRONMENT layer 4 autorité géométrie statique ; LAYER_INTERACTIVE layer 5 autorité triggers ; RESPAWN_DELAY pull depuis Checkpoint sur player_out_of_world). Aucune nouvelle constante cross-system registrée (Level-internal au MVP — futurs Checkpoint/Secret/Enemy GDDs enregistreront leurs consumers). Previous: /consistency-check camera-system : RESPAWN_DELAY 0.2 → 0.05 s (aligné Movement GDD r3 Martin 2026-04-21) ; WALL_RUN_TILT_ANGLE notes nettoyées (Movement GDD patch confirmé). Previous: /design-system player-combat-system : +9 constants Combat (KATANA_REACH, KATANA_RADIUS, SWING_DURATION_MS, ATTACK_COOLDOWN_MS, TUNNELING_THRESHOLD, N_SUBSTEPS, MAX_KILLS_PER_SWING, SLOW_MO_SCALE, SLOW_MO_DURATION_MS) + 5 constants collision layers (LAYER_PLAYER, LAYER_ENEMY, LAYER_ENEMY_HITBOX, LAYER_ENVIRONMENT, LAYER_INTERACTIVE). r_enemy_min = 0.35 m cross-system contract consommé par Combat Section D.3 (non registré comme entrée — contrat Enemy System à figer au GDD futur).

# ─── ENTITIES ────────────────────────────────────────────────────────────────
# Named game-world objects: enemies, NPCs, characters, factions, bosses.
# Register an entity here when it appears in more than one GDD — e.g., an
# enemy defined in combat.md that also drops items listed in inventory.md.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: any key stats that could appear in another GDD
#   (health, damage, drops, faction, etc.)

entities: []

# Example (remove when first real entry is added):
#
# entities:
#   - name: goblin
#     status: active              # active | deprecated
#     source: design/gdd/combat.md
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md
#     health: 40
#     damage: 8
#     drops:
#       - item: goblin_arm        # must match an entry in items section
#         qty: 1
#         drop_rate: 0.8          # 0.0–1.0
#     added: 2026-03-26
#     revised: ""


# ─── ITEMS ───────────────────────────────────────────────────────────────────
# Named collectables, equipment, consumables, crafting materials, currency.
# Register an item when its name or value appears in more than one GDD.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: value_gold, weight, stackable, category, and any stat
#   modifiers that another system (e.g., economy, crafting) might reference.

items: []

# Example:
#
# items:
#   - name: goblin_arm
#     status: active
#     source: design/gdd/combat.md   # drop defined in combat GDD
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md    # inventory GDD lists its weight/stack rules
#       - design/gdd/economy.md      # economy GDD references its sell price
#     value_gold: 5
#     weight: 1
#     stackable: true
#     category: crafting_material
#     added: 2026-03-26
#     revised: ""


# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas: []

# Example:
#
# formulas:
#   - name: damage_formula
#     status: active
#     source: design/gdd/combat.md
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/progression.md   # progression GDD scales attack variable
#     variables:
#       - attack
#       - defense
#       - crit_chance
#       - crit_multiplier
#     output_range: [0, 999]
#     expression: "max(0, attack - defense) * (1 + crit_chance * crit_multiplier)"
#     notes: "Output feeds into health-system damage intake. Min is 0 (armour
#       can absorb all damage). Max is uncapped in formula but tuning knob
#       damage_cap in combat.md clamps at 999."
#     added: 2026-03-26
#     revised: ""


# ─── CONSTANTS ───────────────────────────────────────────────────────────────
