name: Automated Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-input-hot-paths:
    # story-008 AC-PF-2 — zero-alloc lint statique sur InputManager hot paths.
    # Source : .claude/rules/no-alloc-hot-paths.md + ADR-0004 D-8.
    name: Lint — Input Hot Path Alloc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run no-alloc-hot-paths lint
        shell: bash
        run: |
          set -euo pipefail
          target="src/core/input_manager.gd"
          mkdir -p production/qa/evidence
          log="production/qa/evidence/input-lint-$(date +%Y-%m-%d).log"
          echo "# Input hot-path lint — $(date -Iseconds)" > "$log"
          echo "# Scope: $target (functions _unhandled_input, _physics_process, _record_latency_sample)" >> "$log"

          # Function-scoped extraction : n'analyse que le body des 3 hot path functions.
          # awk capture les lignes entre `func <hot>(...)` et le prochain `func ` top-level.
          scoped="/tmp/input_hot_paths_scoped.txt"
          awk '
            /^func[[:space:]]+(_unhandled_input|_physics_process|_record_latency_sample)[[:space:]]*\(/ {
              inside = 1
              printf("### %s\n", $0) > "/tmp/input_hot_paths_scoped.txt"
              next
            }
            /^func[[:space:]]+/ { inside = 0 }
            inside { print NR ":" $0 >> "/tmp/input_hot_paths_scoped.txt" }
          ' "$target"

          if [ ! -s "$scoped" ]; then
            echo "LINT FAIL: could not extract hot path function bodies from $target"
            exit 2
          fi

          # Patterns forbidden (cf. .claude/rules/no-alloc-hot-paths.md).
          # Commentaires (lignes commençant par # après tab/spaces + num:) exclus.
          patterns=(
            '\bpush_back\s*\('
            '\{[^}]*=[^}]*\}'
            '=[[:space:]]*\[[^]]*,[^]]*\]'
            '\.new\s*\(\s*\)'
            '\bString\s*\('
            '"[^"]*"[[:space:]]*\+'
          )
          violations=0
          for pat in "${patterns[@]}"; do
            if matches=$(grep -E "$pat" "$scoped" 2>/dev/null | grep -vE '^[0-9]+:[[:space:]]*#' || true); then
              if [ -n "$matches" ]; then
                echo "--- pattern: $pat ---" >> "$log"
                echo "$matches" >> "$log"
                violations=$((violations + 1))
              fi
            fi
          done

          echo "TOTAL_VIOLATIONS=$violations" >> "$log"
          if [ "$violations" -gt 0 ]; then
            echo "AC-PF-2 FAIL: $violations forbidden pattern(s) matched — see $log"
            cat "$log"
            exit 1
          fi
          echo "AC-PF-2 PASS — 0 forbidden patterns in $target hot paths (scoped)"

      - name: Upload lint log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: input-lint-log
          path: production/qa/evidence/input-lint-*.log

  lint-input-main-thread:
    # story-008 — lint cover-all : Input.* main-thread-only (ADR-0004 D-7 + VC-7).
    # Source : .claude/rules/input-singleton-main-thread-only.md.
    name: Lint — Input Main Thread Only
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run input-singleton-main-thread-only lint
        shell: bash
        run: |
          set -euo pipefail
          review=0
          # Helper : strip les lignes de commentaire (# ou ##) AVANT le grep de patterns.
          # Évite les faux positifs sur la documentation qui nomme Thread/WorkerThreadPool.
          strip_comments() {
            # Supprime : lignes vides, lignes qui commencent (après whitespace) par #.
            grep -vE '^\s*#' "$1" || true
          }
          while IFS= read -r f; do
            # Skip explicite marquage exception ligne par ligne (lint-input-thread-ok)
            if grep -qE '^\s*#\s*lint-input-thread-ok\b' "$f"; then
              continue
            fi
            code="$(strip_comments "$f")"
            # Pattern 1 : Thread(...) / Thread.new / Thread.start avec code exécutable
            if echo "$code" | grep -qE '\bThread\s*(\(|\.new|\.start)'; then
              echo "REVIEW: $f touches Input.* AND instantiates Thread"
              review=$((review + 1))
            fi
            # Pattern 2 : WorkerThreadPool.<method> (exclut "WorkerThreadPool." en ponctuation de phrase)
            if echo "$code" | grep -qE '\bWorkerThreadPool\s*\.\w'; then
              echo "REVIEW: $f touches Input.* AND calls WorkerThreadPool method"
              review=$((review + 1))
            fi
            # Pattern 3 : call_deferred avec Input. en argument
            if echo "$code" | grep -qE 'call_deferred.*Input\.'; then
              echo "REVIEW: $f uses call_deferred with Input.*"
              review=$((review + 1))
            fi
          done < <(grep -rlE '\bInput\s*\.' src/ || true)

          if [ "$review" -gt 0 ]; then
            echo "Main-thread lint FAIL: $review file(s) need manual review"
            exit 1
          fi
          echo "Main-thread lint PASS — 0 suspect cross-thread Input access"

  lint-collision-layers:
    # ADR-0008 D-6 — gate pre-build : (1) bitmask littéral interdit dans src/**/*.gd,
    # (2) project.godot doit déclarer les 5 layer_names canoniques (D-4),
    # (3) .tscn sous scenes/** : WARN seulement au MVP (Risk 1, upgrade FAIL post-MVP).
    # Source : .claude/rules/collision-layer-api-1-indexed.md.
    name: Lint — Collision Layer API 1-Indexed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run collision-layer-api-1-indexed lint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p production/qa/evidence
          log="production/qa/evidence/collision-layers-lint-$(date +%Y-%m-%d).log"
          echo "# Collision layer lint — $(date -Iseconds)" > "$log"

          violations=0

          # ----- Check 1 : bitmask littéral dans src/**/*.gd (D-3) -----
          # Regex : collision_layer ou collision_mask = (0b... | 0x... | décimal).
          # Exclut : (a) lignes commentaires (# ...), (b) src/core/collision_layers.gd
          # (le helper lui-même est autorisé à manipuler des bits via 1 << N).
          echo "" >> "$log"
          echo "## Check 1 — bitmask littéral dans src/**/*.gd" >> "$log"
          if matches=$(grep -rnE '\bcollision_(layer|mask)\s*=\s*(0b[01]+|0x[0-9a-fA-F]+|[0-9]+)' \
              src/ --include='*.gd' \
              | grep -v '^[^:]*:[0-9]*:\s*#' \
              | grep -v '^src/core/collision_layers\.gd:' \
              | grep -v 'lint-collision-layers-ok' || true); then
            if [ -n "$matches" ]; then
              echo "FAIL — bitmask littéral détecté :" >> "$log"
              echo "$matches" >> "$log"
              violations=$((violations + 1))
            else
              echo "PASS — 0 bitmask littéral dans src/**/*.gd" >> "$log"
            fi
          else
            echo "PASS — 0 bitmask littéral dans src/**/*.gd" >> "$log"
          fi

          # ----- Check 2 : project.godot [layer_names]/3d_physics/layer_1..5 (D-4) -----
          echo "" >> "$log"
          echo "## Check 2 — project.godot layer_names canoniques" >> "$log"
          declare -a expected=(
            '3d_physics/layer_1="LAYER_PLAYER"'
            '3d_physics/layer_2="LAYER_ENEMY"'
            '3d_physics/layer_3="LAYER_ENEMY_HITBOX"'
            '3d_physics/layer_4="LAYER_ENVIRONMENT"'
            '3d_physics/layer_5="LAYER_INTERACTIVE"'
          )
          for line in "${expected[@]}"; do
            if ! grep -qF "$line" project.godot; then
              echo "FAIL — manquant dans project.godot : $line" >> "$log"
              violations=$((violations + 1))
            fi
          done
          if grep -q '^\[layer_names\]' project.godot; then
            echo "PASS — section [layer_names] présente" >> "$log"
          else
            echo "FAIL — section [layer_names] absente de project.godot" >> "$log"
            violations=$((violations + 1))
          fi

          # ----- Check 3 : .tscn sous scenes/** — WARN seulement au MVP -----
          echo "" >> "$log"
          echo "## Check 3 — .tscn sous scenes/** (WARN only MVP)" >> "$log"
          if [ -d scenes ]; then
            tscn_hits=$(grep -rnE 'collision_(layer|mask)\s*=\s*[0-9]+' \
                scenes/ --include='*.tscn' 2>/dev/null \
                | awk -F= '{ split($0, a, "="); val = a[2]+0; if (val > 31) print }' || true)
            if [ -n "$tscn_hits" ]; then
              echo "WARN — .tscn avec layer/mask > 31 (couvre layers 6+ non-canoniques) :" >> "$log"
              echo "$tscn_hits" >> "$log"
              echo "::warning::Collision layers : .tscn avec layers 6+ détectés (manual review post-MVP)"
            else
              echo "PASS — 0 .tscn avec layers 6+ non-canoniques" >> "$log"
            fi
          else
            echo "SKIP — répertoire scenes/ absent" >> "$log"
          fi

          # ----- Verdict -----
          echo "" >> "$log"
          echo "TOTAL_VIOLATIONS=$violations" >> "$log"
          cat "$log"
          if [ "$violations" -gt 0 ]; then
            echo "::error::lint-collision-layers FAIL — $violations violation(s) ADR-0008 D-3/D-4"
            exit 1
          fi
          echo "lint-collision-layers PASS"

      - name: Upload lint log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collision-layers-lint-log
          path: production/qa/evidence/collision-layers-lint-*.log

  lint-menu-anti-patterns:
    # story-010 — anti-pattern static lints menu-system.
    # Source : .claude/rules/menu-anti-patterns.md.
    # Couvre AC-MNU-36/44/45/46/47/48/49/50/57/63/64 + R-MNU-18 anti-deps
    # (R-MNU-15/16/18/19 + ADR-0007 D-4 GSM seul autorité + ADR-0010 R-SAV-9 délégation pure).
    # Exception comments : `# lint-menu-ok: <raison>` accepté ligne par ligne.
    name: Lint — Menu Anti-Patterns
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run menu anti-patterns lint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p production/qa/evidence
          log="production/qa/evidence/menu-anti-patterns-lint-$(date +%Y-%m-%d).log"
          echo "# Menu anti-patterns lint — $(date -Iseconds)" > "$log"

          violations=0

          # Helper grep négatif : exit 1 si match (utilisé pour `! grep` négatif).
          # Skip lignes commentaires `#` et exception markers `# lint-menu-ok`.
          run_negative() {
            local label="$1"
            local pattern="$2"
            shift 2
            local paths=("$@")
            local missing=0
            for p in "${paths[@]}"; do
              if [ ! -e "$p" ]; then
                missing=$((missing + 1))
              fi
            done
            if [ "$missing" -eq "${#paths[@]}" ]; then
              echo "## $label — SKIP (paths absent)" >> "$log"
              return 0
            fi
            local matches
            matches=$(grep -rnE "$pattern" "${paths[@]}" 2>/dev/null \
              | grep -v '^[^:]*:[0-9]*:\s*#' \
              | grep -v 'lint-menu-ok' \
              || true)
            if [ -n "$matches" ]; then
              echo "## $label — FAIL" >> "$log"
              echo "$matches" >> "$log"
              violations=$((violations + 1))
            else
              echo "## $label — PASS (0 match)" >> "$log"
            fi
          }

          # ---- AC-MNU-36 + AC-MNU-64 — anti-tween/anim ----
          run_negative "AC-MNU-36 + AC-MNU-64 anti-tween/anim (R-MNU-15 + K.7 + K.9)" \
            '\b(Tween|create_tween|tween_property|InterpolateValue|AnimationPlayer|AnimationTree)\b' \
            src/gameplay/menu/

          # ---- AC-MNU-44 — anti-SFX (scenes/menus + src/gameplay/menu) ----
          run_negative "AC-MNU-44 anti-SFX scenes/menus + src" \
            'AudioStreamPlayer|play_sfx|audio_play' \
            scenes/menus/ src/gameplay/menu/

          # ---- AC-MNU-44 (extended) — scenes/levels parse plus fin (helper) ----
          # Au MVP, scenes/levels/ peut être absent ou vide → SKIP gracieux.
          # Post-MVP : helper script identifie AudioStreamPlayer dans sous-arborescence
          # de pause_overlay.tscn instance vs ambient track étage (Implementation Notes #4).
          if [ -d scenes/levels ] && find scenes/levels -name '*.tscn' -print -quit | grep -q .; then
            level_audio=$(grep -rE 'AudioStreamPlayer' scenes/levels/ --include='*.tscn' 2>/dev/null || true)
            if [ -n "$level_audio" ]; then
              echo "## AC-MNU-44 (scenes/levels) — REVIEW (manual filter pause_overlay sub-tree required)" >> "$log"
              echo "$level_audio" >> "$log"
              echo "::warning::AC-MNU-44 scenes/levels : AudioStreamPlayer detected — verify not in pause_overlay sub-tree"
            else
              echo "## AC-MNU-44 (scenes/levels) — PASS (0 AudioStreamPlayer)" >> "$log"
            fi
          else
            echo "## AC-MNU-44 (scenes/levels) — SKIP (dir absent or empty)" >> "$log"
          fi

          # ---- AC-MNU-45 — anti-confirm dialogs (R-MNU-16 zero confirm) ----
          run_negative "AC-MNU-45 anti-confirm dialogs (R-MNU-16)" \
            'AcceptDialog|ConfirmationDialog|PopupPanel|PopupMenu' \
            scenes/menus/ src/gameplay/menu/

          # ---- AC-MNU-46 — corner_radius zero ou absent (Chrome Zen K.5 hard-edge) ----
          # Particulier : grep MATCH expected mais valeurs doivent toutes être 0.
          if [ -d scenes/menus ]; then
            non_zero_corner=$(grep -rnE 'corner_radius' scenes/menus/ 2>/dev/null \
              | grep -vE '=\s*0\b' \
              | grep -v '^[^:]*:[0-9]*:\s*#' \
              || true)
            if [ -n "$non_zero_corner" ]; then
              echo "## AC-MNU-46 corner_radius zero — FAIL (non-zero values found)" >> "$log"
              echo "$non_zero_corner" >> "$log"
              violations=$((violations + 1))
            else
              echo "## AC-MNU-46 corner_radius zero — PASS" >> "$log"
            fi
          else
            echo "## AC-MNU-46 corner_radius zero — SKIP (scenes/menus absent)" >> "$log"
          fi

          # ---- AC-MNU-47 — anti-Parallax/Animation (scenes/menus) ----
          run_negative "AC-MNU-47 anti-Parallax/AnimationPlayer/AnimationTree" \
            'ParallaxBackground|ParallaxLayer|AnimationPlayer|AnimationTree' \
            scenes/menus/

          # ---- AC-MNU-48 — anti-gradient/material (src/gameplay/menu) ----
          run_negative "AC-MNU-48 anti-gradient/CanvasItemMaterial/ShaderMaterial" \
            'Gradient|GradientTexture|CanvasItemMaterial|ShaderMaterial' \
            src/gameplay/menu/

          # ---- AC-MNU-49 — Engine.time_scale (ADR-0007 D-4 GSM seul autorité) ----
          run_negative "AC-MNU-49 Engine.time_scale (ADR-0007 D-4)" \
            'Engine\.time_scale' \
            src/gameplay/menu/

          # ---- AC-MNU-50 — get_tree().paused mutation (autorité unique GSM) ----
          run_negative "AC-MNU-50 get_tree().paused mutation (GSM only)" \
            'get_tree\(\)\.paused|SceneTree.*paused' \
            src/gameplay/menu/

          # ---- AC-MNU-57 — zéro SaveLoad ref (R-MNU-19 + R-SAV-9 délégation pure) ----
          run_negative "AC-MNU-57 zero SaveLoad reference (R-MNU-19 + R-SAV-9)" \
            'SaveLoad|\bsave_int\b|\bsave_string_array\b|save_now' \
            src/gameplay/menu/

          # ---- AC-MNU-63 — zéro focus notification handler (R-MNU-18 anti-dep) ----
          run_negative "AC-MNU-63 zero focus notification handler (R-MNU-18)" \
            'NOTIFICATION_WM_WINDOW_FOCUS|_notification\b.*_focus' \
            src/gameplay/menu/

          # ---- R-MNU-18 — anti-deps cross-system ----
          run_negative "R-MNU-18 anti-deps cross-system (Level/Combat/Movement/Credit/Secret/Upgrade)" \
            '\b(LevelSystem|CombatSystem|MovementController|CreditSystem|SecretSystem|UpgradeSystem)\b' \
            src/gameplay/menu/

          # ---- Verdict ----
          echo "" >> "$log"
          echo "TOTAL_VIOLATIONS=$violations" >> "$log"
          cat "$log"
          if [ "$violations" -gt 0 ]; then
            echo "::error::lint-menu-anti-patterns FAIL — $violations violation(s) (R-MNU-15/16/18/19 + ADR-0007/0010)"
            exit 1
          fi
          echo "lint-menu-anti-patterns PASS"

      - name: Upload lint log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: menu-anti-patterns-lint-log
          path: production/qa/evidence/menu-anti-patterns-lint-*.log

  lint-hud-anti-patterns:
    # story-005 — anti-pattern static lints hud-system.
    # Source : .claude/rules/hud-anti-patterns.md.
    # Couvre AC-HUD-LINT-1 (outbound-only) + AC-HUD-LINT-2 (zero Input) +
    # AC-HUD-LINT-3 (zero SaveLoad) + AC-HUD-LINT-4 (anti-Animation/Parallax) +
    # AC-HUD-LINT-5 (anti-gradient/material) + AC-HUD-LINT-6 (corner_radius zero) +
    # AC-HUD-LINT-7 (layer < 100 strict).
    # scenes/hud/ absent au MVP (HUD instancié 100% par code) → lints tscn passent gracieusement.
    # Exception comments : `# lint-hud-ok: <raison>` accepté ligne par ligne.
    name: Lint — HUD Anti-Patterns
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run hud anti-patterns lint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p production/qa/evidence
          log="production/qa/evidence/hud-anti-patterns-lint-$(date +%Y-%m-%d).log"
          echo "# HUD anti-patterns lint — $(date -Iseconds)" > "$log"

          violations=0

          # Helper grep négatif : exit 1 si match (lignes commentaires # + lint-hud-ok exclus).
          run_negative() {
            local label="$1"
            local pattern="$2"
            shift 2
            local paths=("$@")
            local missing=0
            for p in "${paths[@]}"; do
              if [ ! -e "$p" ]; then
                missing=$((missing + 1))
              fi
            done
            if [ "$missing" -eq "${#paths[@]}" ]; then
              echo "## $label — SKIP (paths absent)" >> "$log"
              return 0
            fi
            local matches
            matches=$(grep -rnE "$pattern" "${paths[@]}" 2>/dev/null \
              | grep -v '^[^:]*:[0-9]*:\s*#' \
              | grep -v 'lint-hud-ok' \
              || true)
            if [ -n "$matches" ]; then
              echo "## $label — FAIL" >> "$log"
              echo "$matches" >> "$log"
              violations=$((violations + 1))
            else
              echo "## $label — PASS (0 match)" >> "$log"
            fi
          }

          # ---- AC-HUD-LINT-1 — outbound-only zero cross-system (BLOCKING) ----
          run_negative "AC-HUD-LINT-1 outbound-only zero cross-system" \
            'CombatSystem|LevelSystem|MovementController|EnemySystem|Player\.|AudioSystem|AudioServer|AudioStreamPlayer' \
            src/gameplay/hud/

          # ---- AC-HUD-LINT-2 — zero Input HUD MVP (BLOCKING) ----
          run_negative "AC-HUD-LINT-2 zero Input HUD MVP" \
            '\bInputManager\b|\bInput\.' \
            src/gameplay/hud/

          # ---- AC-HUD-LINT-3 — zero SaveLoad ref (BLOCKING) ----
          run_negative "AC-HUD-LINT-3 zero SaveLoad ref" \
            'SaveLoad|\bsave_int\b|\bsave_string_array\b|save_now' \
            src/gameplay/hud/

          # ---- AC-HUD-LINT-4 — anti-Animation/Parallax (BLOCKING) ----
          # scenes/hud/ peut ne pas exister — handle gracefully via run_negative SKIP.
          run_negative "AC-HUD-LINT-4 anti-Animation/Parallax" \
            'AnimationPlayer|AnimationTree|ParallaxBackground|ParallaxLayer' \
            src/gameplay/hud/ scenes/hud/

          # ---- AC-HUD-LINT-5 — anti-gradient/material (ADVISORY) ----
          # Note : ADVISORY — avertissement sans incrément violations (pas BLOCKING).
          advisory_matches=$(grep -rnE 'Gradient|GradientTexture|CanvasItemMaterial|ShaderMaterial' \
            src/gameplay/hud/ 2>/dev/null \
            | grep -v '^[^:]*:[0-9]*:\s*#' \
            | grep -v 'lint-hud-ok' \
            || true)
          if [ -n "$advisory_matches" ]; then
            echo "## AC-HUD-LINT-5 anti-gradient/material — ADVISORY (Chrome Zen K.8)" >> "$log"
            echo "$advisory_matches" >> "$log"
            echo "::warning::AC-HUD-LINT-5: gradient/material detected in src/gameplay/hud/ — review for Chrome Zen compliance"
          else
            echo "## AC-HUD-LINT-5 anti-gradient/material — PASS (0 match)" >> "$log"
          fi

          # ---- AC-HUD-LINT-6 — corner_radius zero (BLOCKING) ----
          # scenes/hud/ absent au MVP → SKIP gracieux.
          if [ -d scenes/hud ]; then
            non_zero_corner=$(grep -rnE 'corner_radius' scenes/hud/ 2>/dev/null \
              | grep -vE '=\s*0\b' \
              | grep -v '^[^:]*:[0-9]*:\s*#' \
              || true)
            if [ -n "$non_zero_corner" ]; then
              echo "## AC-HUD-LINT-6 corner_radius zero — FAIL (non-zero values found)" >> "$log"
              echo "$non_zero_corner" >> "$log"
              violations=$((violations + 1))
            else
              echo "## AC-HUD-LINT-6 corner_radius zero — PASS" >> "$log"
            fi
          else
            echo "## AC-HUD-LINT-6 corner_radius zero — SKIP (scenes/hud absent)" >> "$log"
          fi

          # ---- AC-HUD-LINT-7 — layer < 100 strict (BLOCKING) ----
          # Refuse : .layer = 100 / 101-199 / 200-999. Autorise : .layer = 50 (HUD_CANVAS_LAYER).
          run_negative "AC-HUD-LINT-7 layer < 100 strict" \
            '\.layer\s*=\s*(100|10[1-9]|1[1-9][0-9]|[2-9][0-9][0-9])' \
            src/gameplay/hud/

          # ---- Verdict ----
          echo "" >> "$log"
          echo "TOTAL_VIOLATIONS=$violations" >> "$log"
          cat "$log"
          if [ "$violations" -gt 0 ]; then
            echo "::error::lint-hud-anti-patterns FAIL — $violations violation(s) (hud-anti-patterns.md)"
            exit 1
          fi
          echo "lint-hud-anti-patterns PASS"

      - name: Upload lint log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hud-anti-patterns-lint-log
          path: production/qa/evidence/hud-anti-patterns-lint-*.log

  lint-audio-anti-patterns:
    # story-009 — anti-pattern static lints audio-system.
    # Source : .claude/rules/audio-anti-patterns.md.
    # Couvre AC-AUD-10 (Tween volume_db) + AC-AUD-11 (connect sans CONNECT_DEFERRED dans _on_*)
    # + AC-AUD-12 (AudioStreamPlayer.new() hors audio_system.gd).
    # R-AUD-1/4/5 + ADR-0009 D-2/D-3/D-4 — guard structurel rapide indépendant runtime.
    # Exception comments : `# lint-audio-{tween,deferred,pool}-ok: <raison>` accepté ligne par ligne.
    name: Lint — Audio Anti-Patterns
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run audio anti-patterns lint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p production/qa/evidence
          log="production/qa/evidence/audio-anti-patterns-lint-$(date +%Y-%m-%d).log"
          echo "# Audio anti-patterns lint — $(date -Iseconds)" > "$log"

          violations=0

          # ---- AC-AUD-10 — anti-Tween volume_db (R-AUD-4 + ADR-0009 D-3) ----
          # Wall-clock fades exclusivement via _physics_process + _get_time_msec
          # Callable injection. Tween sur volume_db est time_scale-scaled donc
          # casse Pillar 1 60 fps wall-clock.
          paths_tween=()
          [ -f src/core/audio_system.gd ] && paths_tween+=("src/core/audio_system.gd")
          [ -d src/gameplay/audio ] && paths_tween+=("src/gameplay/audio/")
          if [ "${#paths_tween[@]}" -eq 0 ]; then
            echo "## AC-AUD-10 anti-Tween volume_db — SKIP (paths absent)" >> "$log"
          else
            tween_matches=$(grep -rnE 'Tween\.tween_property.*volume_db|tween\..*audio.*volume_db' \
              "${paths_tween[@]}" 2>/dev/null \
              | grep -v '^[^:]*:[0-9]*:\s*#' \
              | grep -v 'lint-audio-tween-ok' \
              || true)
            if [ -n "$tween_matches" ]; then
              echo "## AC-AUD-10 anti-Tween volume_db — FAIL" >> "$log"
              echo "$tween_matches" >> "$log"
              violations=$((violations + 1))
            else
              echo "## AC-AUD-10 anti-Tween volume_db — PASS (0 match)" >> "$log"
            fi
          fi

          # ---- AC-AUD-11 — connect() sans CONNECT_DEFERRED dans _on_* (R-AUD-5 + ADR-0009 D-4) ----
          # Tous les connect() vers handlers _on_* AudioSystem doivent inclure
          # CONNECT_DEFERRED pour éviter mutations cross-system mid-physics-frame.
          paths_def=()
          [ -f src/core/audio_system.gd ] && paths_def+=("src/core/audio_system.gd")
          [ -d src/gameplay/audio ] && paths_def+=("src/gameplay/audio/")
          if [ "${#paths_def[@]}" -eq 0 ]; then
            echo "## AC-AUD-11 connect CONNECT_DEFERRED — SKIP (paths absent)" >> "$log"
          else
            def_matches=$(grep -rnE '\.connect\([^,)]+\)\s*$' \
              "${paths_def[@]}" 2>/dev/null \
              | grep -v '^[^:]*:[0-9]*:\s*#' \
              | grep -v 'lint-audio-deferred-ok' \
              | grep -E '_on_[a-z_]+' \
              || true)
            if [ -n "$def_matches" ]; then
              echo "## AC-AUD-11 connect CONNECT_DEFERRED — FAIL" >> "$log"
              echo "$def_matches" >> "$log"
              violations=$((violations + 1))
            else
              echo "## AC-AUD-11 connect CONNECT_DEFERRED — PASS (0 match)" >> "$log"
            fi
          fi

          # ---- AC-AUD-12 — AudioStreamPlayer.new() hors audio_system.gd (R-AUD-1 + ADR-0009 D-2) ----
          # Seul src/core/audio_system.gd instancie AudioStreamPlayer*. Consumers
          # passent par API publique (play_2d, play_3d_at, play_music, duck_bus).
          if [ -d src ]; then
            pool_matches=$(grep -rnE 'AudioStreamPlayer\.new\(\)|AudioStreamPlayer3D\.new\(\)|AudioListener3D\.new\(\)' \
              src/ 2>/dev/null \
              | grep -v 'src/core/audio_system.gd' \
              | grep -v '^[^:]*:[0-9]*:\s*#' \
              | grep -v 'lint-audio-pool-ok' \
              || true)
            if [ -n "$pool_matches" ]; then
              echo "## AC-AUD-12 pool exclusive — FAIL" >> "$log"
              echo "$pool_matches" >> "$log"
              violations=$((violations + 1))
            else
              echo "## AC-AUD-12 pool exclusive — PASS (0 match)" >> "$log"
            fi
          else
            echo "## AC-AUD-12 pool exclusive — SKIP (src/ absent)" >> "$log"
          fi

          # ---- Verdict ----
          echo "" >> "$log"
          echo "TOTAL_VIOLATIONS=$violations" >> "$log"
          cat "$log"
          if [ "$violations" -gt 0 ]; then
            echo "::error::lint-audio-anti-patterns FAIL — $violations violation(s) (R-AUD-1/4/5 + ADR-0009 D-2/D-3/D-4)"
            exit 1
          fi
          echo "lint-audio-anti-patterns PASS"

      - name: Upload lint log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-anti-patterns-lint-log
          path: production/qa/evidence/audio-anti-patterns-lint-*.log

  lint-vfx-anti-patterns:
    # story-007 — anti-pattern static lints vfx-system.
    # Source : .claude/rules/vfx-anti-patterns.md.
    # Couvre AC-VFX-05 (pool exclusive) + AC-NEW-09 (anti-Tween color/modulate)
    # + AC-NEW-10 (connect sans CONNECT_DEFERRED dans _on_*) + AC-VFX-23 (outbound-zero).
    # R-VFX-1/3/5/14/15 + ADR-0009 D-2/D-3/D-4 — guard structurel rapide indépendant runtime.
    # Exception comments : `# lint-vfx-{pool,tween,deferred,outbound}-ok: <raison>` accepté ligne par ligne.
    name: Lint — VFX Anti-Patterns (4 grep gates BLOCKING)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run VFX anti-patterns lint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p production/qa/evidence
          log="production/qa/evidence/vfx-anti-patterns-lint-$(date +%Y-%m-%d).log"
          echo "# VFX anti-patterns lint — $(date -Iseconds)" > "$log"

          violations=0

          # ---- AC-VFX-05 — pool exclusive (R-VFX-1 + ADR-0009 D-2) ----
          # Seul src/core/vfx_system.gd instancie GPUParticles3D / Decal / MeshInstance3D.
          # Les consumers passent par l'API publique (play_kill_at, flash_kill, etc.).
          if [ -d src ]; then
            pool_matches=$(grep -rnE 'GPUParticles3D\.new\(\)|Decal\.new\(\)|MeshInstance3D\.new\(\)' \
              src/ 2>/dev/null \
              | grep -v 'src/core/vfx_system.gd' \
              | grep -v '^[^:]*:[0-9]*:\s*#' \
              | grep -v 'lint-vfx-pool-ok' \
              || true)
            if [ -n "$pool_matches" ]; then
              echo "## AC-VFX-05 pool exclusive — FAIL" >> "$log"
              echo "$pool_matches" >> "$log"
              violations=$((violations + 1))
            else
              echo "## AC-VFX-05 pool exclusive — PASS (0 match)" >> "$log"
            fi
          else
            echo "## AC-VFX-05 pool exclusive — SKIP (src/ absent)" >> "$log"
          fi

          # ---- AC-NEW-09 — anti-Tween color/modulate/opacity/alpha (R-VFX-5/15 + ADR-0009 D-3) ----
          # Wall-clock fades exclusivement via _physics_process + Time.get_ticks_msec().
          # Tween sur color/modulate est time_scale-scaled donc casse Pillar 1 60 fps wall-clock.
          paths_tween=()
          [ -f src/core/vfx_system.gd ] && paths_tween+=("src/core/vfx_system.gd")
          [ -d src/gameplay/vfx ] && paths_tween+=("src/gameplay/vfx/")
          if [ "${#paths_tween[@]}" -eq 0 ]; then
            echo "## AC-NEW-09 anti-Tween color/modulate — SKIP (paths absent)" >> "$log"
          else
            tween_matches=$(grep -rnE 'Tween\.tween_property.*\b(color|modulate|opacity|alpha)\b' \
              "${paths_tween[@]}" 2>/dev/null \
              | grep -v '^[^:]*:[0-9]*:\s*#' \
              | grep -v 'lint-vfx-tween-ok' \
              || true)
            if [ -n "$tween_matches" ]; then
              echo "## AC-NEW-09 anti-Tween color/modulate — FAIL" >> "$log"
              echo "$tween_matches" >> "$log"
              violations=$((violations + 1))
            else
              echo "## AC-NEW-09 anti-Tween color/modulate — PASS (0 match)" >> "$log"
            fi
          fi

          # ---- AC-NEW-10 — connect() sans CONNECT_DEFERRED dans _on_* (R-VFX-3 + ADR-0009 D-4) ----
          # Tous les connect() vers handlers _on_* VFXSystem doivent inclure
          # CONNECT_DEFERRED pour éviter mutations cross-system mid-physics-frame.
          paths_def=()
          [ -f src/core/vfx_system.gd ] && paths_def+=("src/core/vfx_system.gd")
          [ -d src/gameplay/vfx ] && paths_def+=("src/gameplay/vfx/")
          if [ "${#paths_def[@]}" -eq 0 ]; then
            echo "## AC-NEW-10 connect CONNECT_DEFERRED — SKIP (paths absent)" >> "$log"
          else
            def_matches=$(grep -rnE '\.connect\([^,)]+\)\s*$' \
              "${paths_def[@]}" 2>/dev/null \
              | grep -v '^[^:]*:[0-9]*:\s*#' \
              | grep -v 'lint-vfx-deferred-ok' \
              | grep -E '_on_[a-z_]+' \
              || true)
            if [ -n "$def_matches" ]; then
              echo "## AC-NEW-10 connect CONNECT_DEFERRED — FAIL" >> "$log"
              echo "$def_matches" >> "$log"
              violations=$((violations + 1))
            else
              echo "## AC-NEW-10 connect CONNECT_DEFERRED — PASS (0 match)" >> "$log"
            fi
          fi

          # ---- AC-VFX-23 — outbound-zero (R-VFX-14 terminal pur) ----
          # VFX System outbound-zero — n'émet aucun signal, ne mute aucun état amont.
          paths_emit=()
          [ -f src/core/vfx_system.gd ] && paths_emit+=("src/core/vfx_system.gd")
          [ -d src/gameplay/vfx ] && paths_emit+=("src/gameplay/vfx/")
          if [ "${#paths_emit[@]}" -eq 0 ]; then
            echo "## AC-VFX-23 outbound-zero — SKIP (paths absent)" >> "$log"
          else
            emit_matches=$(grep -rnE 'emit_signal\b|\.emit\(' \
              "${paths_emit[@]}" 2>/dev/null \
              | grep -v '^[^:]*:[0-9]*:\s*#' \
              | grep -v 'lint-vfx-outbound-ok' \
              || true)
            if [ -n "$emit_matches" ]; then
              echo "## AC-VFX-23 outbound-zero — FAIL" >> "$log"
              echo "$emit_matches" >> "$log"
              violations=$((violations + 1))
            else
              echo "## AC-VFX-23 outbound-zero — PASS (0 match)" >> "$log"
            fi
          fi

          # ---- Verdict ----
          echo "" >> "$log"
          echo "TOTAL_VIOLATIONS=$violations" >> "$log"
          cat "$log"
          if [ "$violations" -gt 0 ]; then
            echo "::error::lint-vfx-anti-patterns FAIL — $violations violation(s) (R-VFX-1/3/5/14/15 + ADR-0009 D-2/D-3/D-4)"
            exit 1
          fi
          echo "lint-vfx-anti-patterns PASS"

      - name: Upload lint log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vfx-anti-patterns-lint-log
          path: production/qa/evidence/vfx-anti-patterns-lint-*.log

  lint-level-invariants:
    # story-010 AC-LVL-11 — lint pre-build hiérarchie canonique scènes d'étage.
    # Valide StaticEnvironment, InteractiveVolumes, SpawnMarkers (Node3D) +
    # EtageExitTrigger (Area3D) dans chaque etage_*.tscn sous scenes/levels/.
    # Exit 0 si aucune scène trouvée (pipeline valide avant production).
    # Source : TR-lvl-006, ADR-0011 D-2, .claude/rules/.
    name: Lint — Level Hierarchy Invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.2
          use-dotnet: false

      - name: Build class cache (resolve class_name for autoloads)
        shell: bash
        run: |
          # Force-build .godot/global_script_class_cache.cfg : sans ce fichier, le
          # parser ne résout pas les class_name référencés depuis les autoload chain
          # (e.g. level_system.gd:238 EnemySpawner, :802 CollisionLayers), et reporte
          # un misleading "does not inherit from 'Node'" en cascade sur tous les
          # autoloads (input_manager → accessibility_service → upgrade → level → GSM).
          # Memory rule godot_tests_headless_safe_pattern documente le prérequis.
          # CI ubuntu-latest = pas de risque GUI alert (CLAUDE.md warning macOS only).
          timeout 90 godot --headless --editor --quit-after 2 || true
          test -f .godot/global_script_class_cache.cfg \
            || { echo "FAIL: class cache not built"; exit 1; }
          echo "class cache built ($(wc -c < .godot/global_script_class_cache.cfg) bytes)"

      - name: Run level hierarchy lint
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --script tools/lint/run_level_lint.gd
          echo "lint-level-invariants PASS"

  perf-level-ccd:
    # story-014 AC-LVL-41 — EC-8 Jolt CCD benchmark sub-gate.
    # Valide que le runner exit 0 (clips_rate == 0 sur murs >= 0.3m).
    # Simulation Jolt réelle : 3 arenas (0.2m / 0.3m / 0.5m), CharacterBody3D
    # @ 27 m/s, 100 passes par config, détection tunneling via comparaison
    # global_position.z vs wall_back_z avec accumulated_collisions == 0.
    # AC-LVL-41 reste PLAYTEST gate final (evidence manuelle requise).
    # Source : ADR-0001 EC-8 CLAIM-UNVERIFIED, TR-lvl-039, story-014 AC-LVL-41.
    name: Perf — Level CCD Sweep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.2
          use-dotnet: false

      - name: Build class cache (resolve class_name for autoloads)
        shell: bash
        run: |
          timeout 90 godot --headless --editor --quit-after 2 || true
          test -f .godot/global_script_class_cache.cfg \
            || { echo "FAIL: class cache not built"; exit 1; }
          echo "class cache built ($(wc -c < .godot/global_script_class_cache.cfg) bytes)"

      - name: Run CCD sweep benchmark
        shell: bash
        run: |
          set -euo pipefail
          # EXCEPTION DOCUMENTÉE à CLAUDE.md "Godot CLI Safety" rule #1
          # ("Always pass --headless AND --script <path.gd>") :
          #   level_ccd_sweep_runner.gd extends Node3D (pas SceneTree) car
          #   CharacterBody3D.move_and_slide() + Jolt physics requièrent un
          #   SceneTree actif (await get_tree().physics_frame). Un script
          #   extends SceneTree ne peut pas piloter move_and_slide().
          #   → On lance la scène compagnon via --path + chemin .tscn
          #   positionnel (pattern Godot main scene standard).
          # Sécurité : ce job DOIT tourner sur Linux/Ubuntu CI uniquement.
          # Sur macOS local le pattern peut popper OS::alert() (incident
          # 2026-04-27, voir CLAUDE.md). Ne pas réutiliser ce pattern dans un
          # autre job sans justification équivalente (Node3D root requis).
          mkdir -p production/qa
          log="production/qa/perf-level-ccd-sweep-$(date +%Y-%m-%d).log"
          godot --headless --path . tests/performance/level_ccd_sweep_runner.tscn 2>&1 | tee "$log"
          # Extraire le JSON_RESULT (ligne suivant le marker) pour la regression gate.
          awk '/^JSON_RESULT:/{getline; print; exit}' "$log" > /tmp/ccd-sweep-current.json
          test -s /tmp/ccd-sweep-current.json || { echo "FAIL: JSON_RESULT introuvable dans $log"; exit 2; }
          echo "perf-level-ccd PASS"

      - name: Regression gate — sweep vs baseline (story-023 AC-LVL-44)
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --script tools/perf/compare_ccd_baseline.gd -- \
            tests/baselines/level-ccd-baseline.json \
            /tmp/ccd-sweep-current.json \
            sweep
          echo "regression-gate sweep PASS"

      - name: Upload CCD sweep log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-level-ccd-sweep-log
          path: production/qa/perf-level-ccd-sweep-*.log

