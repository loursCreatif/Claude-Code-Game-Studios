    #          TR-lvl-035, TR-lvl-036, story-017 AC-LVL-3 / AC-LVL-34 / AC-LVL-35a.
    name: Perf — Level Frame Time Budget
    runs-on: ubuntu-latest
    # Hard timeout — runner peut hang en headless CI si get_tree().process_frame
    # ne fire pas (pattern --path + .tscn extension Node3D, sanity boundary observée
    # 2026-05-10 run 25624770162 → 14+ min in_progress sans progression). 5 min
    # couvre largement le runtime nominal (~30-60 s : 500 frames + 24 frames
    # transition + load time + boot Godot 4.6.2).
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.2
          use-dotnet: false

      - name: Build class cache (resolve class_name for autoloads)
        shell: bash
        run: |
          timeout 90 godot --headless --editor --quit-after 2 || true
          test -f .godot/global_script_class_cache.cfg \
            || { echo "FAIL: class cache not built"; exit 1; }
          echo "class cache built ($(wc -c < .godot/global_script_class_cache.cfg) bytes)"

      - name: Run frame time budget benchmark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p production/qa
          log="production/qa/perf-level-frame-time-$(date +%Y-%m-%d).log"
          # Class cache pré-build (step précédent) résout les autoload errors qui
          # empêchaient _ready() de fire ; le runner peut désormais booter, hit
          # son skip in-script `OS.has_environment("CI") or not window_can_draw()`
          # (L229-244 du runner), et retourner JSON_RESULT placeholder PASS.
          # Gate significative uniquement Tier 1 hardware réel (Mac M4 / dev kits /
          # Steam Deck) — pattern miroir story-016 VRAM=0=PASS. Timeout-5min job
          # reste comme safety net si jamais un autre hang régresse.
          godot --headless --path . tests/performance/level_frame_time_runner.tscn 2>&1 | tee "$log"
          echo "perf-level-frame-time PASS"

      - name: Upload frame time benchmark log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-level-frame-time-log
          path: production/qa/perf-level-frame-time-*.log

  test:
    name: Run GdUnit4 Tests
    runs-on: ubuntu-latest
    # Note : perf-level-ccd ET perf-level-frame-time retirés des `needs` — runners
    # documentés STUB Sprint 1 (CLAUDE.md tech-debt #1 + #1b, active.md).
    # CCD Sweep : EC-8 Jolt sanity FAIL en CI headless attendu jusqu'au fix Sprint 1.
    # Frame Time : runner --path + .tscn extension Node3D hang en headless ubuntu
    # (await get_tree().process_frame ne fire pas) → cancelled via timeout 5 min.
    # Le test gdunit4-action gate ne doit pas être bloqué par ces STUBs ; Sprint 1
    # ownership ré-établira les deps quand les runners seront fixés.
    needs: [lint-input-hot-paths, lint-input-main-thread, lint-collision-layers, lint-menu-anti-patterns, lint-hud-anti-patterns, lint-audio-anti-patterns, lint-vfx-anti-patterns, lint-level-invariants, perf-level-ccd-gameplay, perf-level-draw-calls, perf-level-memory]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Run GdUnit4 Tests
        uses: godot-gdunit-labs/gdUnit4-action@v1
        with:
          godot-version: '4.6.2'
          paths: |
            tests/unit
            tests/integration
          report-name: test-results
          # Disable dorny/test-reporter@v3 post-step (action recommandation explicite
          # "To disable to run on forked repositories"). Sur fork PR, le post-step
          # tente de créer un check via GITHUB_TOKEN qui n'a pas la permission
          # `checks:write` → step fail malgré 1117/1117 tests PASS, conclusion=failure
          # propage au job alors que tests réels passent. Tests results restent
          # accessibles via Upload Test Results artifact (reports/) ci-dessous.
          publish-report: false

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: reports/
